<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Divide</title>
<style>
:root{color-scheme:dark;--bg:#0b1226;--panel:#162044;--line:rgba(255,255,255,.18);--txt:#f8fafc;--mut:#cbd5e1;--vol:#60a5fa;--vor:#34d399;--vel:#fbbf24;--ver:#c084fc;--bad:#fb7185;--ok:#34d399}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);background:radial-gradient(900px 500px at 12% -10%,#1e3a8a 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#581c87 0,transparent 55%),var(--bg);min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 90px}
h1{margin:6px 0 2px;font-size:28px}h2{margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 14px;line-height:1.5}
.panel{position:relative;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:20px;padding:20px;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 8px 20px rgba(99,102,241,.4)}
.btn:hover:not(:disabled){filter:brightness(1.12)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:rgba(255,255,255,.14);box-shadow:none}.btn.red{background:linear-gradient(135deg,#ef4444,#f97316)}
.btn.sm{padding:8px 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Bytey */
.say{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.bot{font-size:46px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(3deg)}}
.bub{background:#fff;color:#0f172a;border-radius:6px 18px 18px 18px;padding:10px 14px;font-weight:700;line-height:1.45;max-width:640px}
.bub small{display:block;color:#475569;font-weight:600;margin-top:3px}
/* menu */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.tile{text-align:left;border-radius:18px;padding:16px;border:2px solid var(--line);background:rgba(0,0,0,.25);transition:.15s}
.tile:hover{transform:translateY(-3px);border-color:#a5b4fc}
.tile .e{font-size:34px}.tile b{display:block;font-size:17px;margin:4px 0 2px}.tile span{font-size:13px;color:var(--mut)}
.tile.done{border-color:var(--ok);background:rgba(16,185,129,.12)}
.tile .st{float:right;font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;background:rgba(255,255,255,.14)}
.tile.done .st{background:var(--ok);color:#052e1d}
.nb{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.nbc{border-radius:14px;padding:10px 12px;border:2px dashed var(--line);font-size:13.5px;color:var(--mut);min-height:84px}
.nbc.on{border-style:solid;color:var(--txt);background:rgba(0,0,0,.28)}
.nbc b{display:block;font-size:16px}
.c-vol{border-color:var(--vol)!important}.c-vol b{color:var(--vol)}
.c-vor{border-color:var(--vor)!important}.c-vor b{color:var(--vor)}
.c-vel{border-color:var(--vel)!important}.c-vel b{color:var(--vel)}
.c-ver{border-color:var(--ver)!important}.c-ver b{color:var(--ver)}
/* sheet */
.sheet{width:100%;border-collapse:collapse;background:#f8fafc;color:#0f172a;font-size:13px;border-radius:10px;overflow:hidden}
.sheet th{background:#16a34a;color:#fff;padding:6px 8px;text-align:left}.sheet td{padding:5px 8px;border-bottom:1px solid #e2e8f0}
.sheetbar{display:flex;justify-content:space-between;background:#166534;color:#fff;padding:6px 10px;font-size:13px;font-weight:700;border-radius:10px 10px 0 0}
.meter{height:14px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34d399,#fbbf24,#ef4444);transition:width .3s}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-weight:800}.stats span{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 12px}
.crash{position:absolute;inset:0;background:rgba(15,5,20,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;animation:glitch .5s;z-index:5}
.crash .big{font-size:60px}
@keyframes glitch{0%{transform:translateX(-8px)}20%{transform:translateX(8px)}40%{transform:translateX(-6px)}60%{transform:translateX(6px)}100%{transform:none}}
.shake{animation:glitch .4s}
/* import */
.items{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.item{border:2px solid var(--line);background:rgba(0,0,0,.3);border-radius:14px;padding:10px 14px;font-weight:700}
.item.sel{border-color:#fbbf24;background:rgba(251,191,36,.2);transform:scale(1.05)}.item.tried{opacity:.5;text-decoration:line-through}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.col{border-radius:12px;border:2px solid #86efac;background:#f0fdf4;color:#14532d;padding:12px;font-weight:800;text-align:center}
.col small{display:block;font-weight:600;color:#166534}
.msg{min-height:44px;margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(251,113,133,.15);border:1px solid rgba(251,113,133,.5);font-weight:700}
/* belt */
.belt{position:relative;height:210px;border-radius:16px;background:repeating-linear-gradient(90deg,#1e293b 0 28px,#243049 28px 56px);border:2px solid #475569;overflow:hidden}
.pk{position:absolute;top:80px;width:54px;height:54px;border-radius:12px;background:#fff;color:#0f172a;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #6366f1;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.pk:hover{border-color:#fbbf24}
.pk.gone{opacity:0;transform:scale(1.6);transition:.3s}
.tool{position:absolute;right:0;top:0;bottom:0;width:64px;background:rgba(239,68,68,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;writing-mode:vertical-rl;letter-spacing:.1em}
/* readings */
.rd{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.rdc{border-radius:12px;padding:10px;background:rgba(0,0,0,.3);border:2px solid var(--line);font-weight:800;text-align:center}
.rdc.bad:hover{border-color:var(--bad)}.rdc.gone{opacity:.25;text-decoration:line-through}
.avg{font-size:30px;font-weight:900}
.q{margin:12px 0;display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.28);font-weight:700;line-height:1.4}
.opt:hover:not(:disabled){border-color:#a5b4fc;background:rgba(99,102,241,.2)}
.opt.good{border-color:var(--ok);background:rgba(16,185,129,.25)}.opt.no{border-color:var(--bad);background:rgba(244,63,94,.25)}
.stamp{margin:12px 0;padding:16px;border-radius:18px;border:3px solid;text-align:center;animation:stamp .5s}
.stamp .big{font-size:40px;font-weight:900}
@keyframes stamp{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
textarea{width:100%;min-height:64px;margin-top:6px;padding:10px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-size:14.5px}
.cards{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.num{min-width:54px;height:54px;border-radius:12px;border:3px solid #6366f1;background:#fff;color:#0f172a;font-weight:900;font-size:19px;padding:0 8px}
.num.sel{border-color:#fbbf24;background:#fef3c7;transform:translateY(-6px)}.more{color:var(--mut);font-weight:700}
.scene{background:#fff;color:#0f172a;border-radius:12px;padding:12px 14px;line-height:1.7;font-weight:600}
.map{display:flex;justify-content:space-around;background:#d1fae5;border-radius:10px;padding:14px;margin-bottom:6px;font-weight:800}.pin{background:#fecaca;border-radius:8px;padding:2px 8px}
.wave{font-size:26px;letter-spacing:2px;color:#6366f1}.frames{display:flex;gap:8px;margin-bottom:6px}.frames span{flex:1;background:#0f172a;color:#fff;border-radius:8px;padding:8px;text-align:center;font-size:13px}
.board{display:flex;gap:8px;flex-wrap:wrap;min-height:40px}.pinned{background:rgba(251,191,36,.2);border:2px solid #fbbf24;border-radius:10px;padding:6px 12px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.phone{border:3px solid var(--line);border-radius:18px;background:rgba(0,0,0,.28);padding:16px;text-align:center}
.phone:hover:not(:disabled){border-color:#a5b4fc}.phone.pick{border-color:#fbbf24}.phone small{color:var(--mut)}
.reviews{display:grid;gap:8px;margin:10px 0}.rev{text-align:left;border:2px solid var(--line);border-radius:14px;background:rgba(0,0,0,.28);padding:10px 12px;line-height:1.45}
.rev span{margin-right:6px}.rev small{display:block;color:var(--mut);font-weight:600}.rev:hover{border-color:#a5b4fc}.rev.gone{opacity:.3;text-decoration:line-through}.rev.no{border-color:var(--bad);background:rgba(244,63,94,.2)}
.mailroom{position:relative;height:190px;border-radius:16px;background:linear-gradient(180deg,#1e293b,#334155);border:2px solid #475569;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:10px 0}
.parcel{background:#fde68a;color:#451a03;border-radius:14px;padding:12px 22px;text-align:center;font-weight:700;line-height:1.5;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.bins3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dbin{border:3px solid;border-radius:14px;background:rgba(0,0,0,.3);padding:16px 6px;font-weight:900;font-size:17px}
.dbin:hover{filter:brightness(1.3);transform:translateY(-3px)}
.fall{position:absolute;font-size:34px;top:-50px;animation:drop 1.1s ease-in forwards}
@keyframes drop{to{top:calc(100% - 44px);transform:rotate(18deg)}}
.mailroom.buried .parcel{opacity:.25}
.who{display:flex;gap:12px;align-items:center;margin:4px 0 8px}.wf{font-size:48px}.wq{background:#fff;color:#0f172a;border-radius:6px 18px 18px 18px;padding:10px 14px;font-weight:700;line-height:1.4}
.shopx{line-height:1.5}.queue{font-size:26px;margin:6px 0}
.phone{width:230px;max-width:100%;margin:8px auto;border:5px solid #94a3b8;border-radius:26px;background:#0f172a;padding:10px;min-height:170px}
.scr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.scr .big2{font-size:54px}
.ico{border:0;border-radius:12px;padding:12px 2px;background:#334155;font-weight:800;font-size:12px}.ico:hover{background:#4f46e5}.ico.wrongb{background:#7f1d1d}
.cardsx{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chp{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(0,0,0,.3);font-weight:800;font-size:14px;text-align:left}
.chp:hover:not(:disabled){border-color:#a5b4fc}.chp.good{border-color:var(--ok);background:rgba(16,185,129,.28)}.chp.no{border-color:var(--bad);background:rgba(244,63,94,.25)}.chp.pick{border-color:#fbbf24;background:rgba(251,191,36,.22)}.chp:disabled{opacity:.7}
.meter.big{height:22px}
.web{background:#f8fafc;color:#0f172a;border-radius:14px;padding:12px;display:grid;gap:8px;margin:10px 0}
.wt{padding:8px 10px;border-radius:8px;background:#e2e8f0;cursor:pointer}.wt.read{background:#bbf7d0}
.wi{padding:14px;border-radius:10px;background:#cbd5e1;text-align:center;font-size:36px;cursor:pointer}.wi small{display:block;font-size:12px;font-weight:700;color:#334155;margin-top:4px}.wi.mute{outline:3px solid #ef4444}.wi.small{font-size:28px;cursor:default}
.reader{background:#0f172a;border:2px solid #38bdf8;border-radius:12px;padding:10px;font-weight:700;min-height:44px;margin:8px 0;line-height:1.5}
.webbtn{border:0;border-radius:10px;padding:12px;background:#2563eb;color:#fff;font-weight:900;font-size:16px}.webbtn:disabled{background:#16a34a}
.dsr{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;margin:8px 0}@media(max-width:480px){.dsr{grid-template-columns:1fr}}
input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:var(--txt)}
.err{color:#fda4af;font-weight:700;min-height:20px}
.langs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0;font-weight:800}.stats span{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 12px}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.tc{border-radius:14px;padding:10px;text-align:center;font-weight:800;border:2px solid var(--line);background:rgba(0,0,0,.3);animation:pop .5s both;line-height:1.3}
.tc .e{font-size:30px;display:block}.tc b{display:block;font-size:24px}.tc.bad{border-color:var(--bad);background:rgba(244,63,94,.22)}.tc.bad b{color:#fb7185}.tc.okc{border-color:var(--ok)}.tc.okc b{color:#34d399}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.hide{display:none!important}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.5);font-size:14.5px;line-height:1.55}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>
.stagebox{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#0f1733;margin:8px 0}
.stagebox svg{display:block;width:100%;height:auto}
.dotsr{display:flex;gap:10px;justify-content:center;margin:6px 0 10px;font-size:26px}
.dotsr span{filter:grayscale(1) opacity(.45);transition:.3s}.dotsr span.on{filter:none;transform:scale(1.15)}.dotsr span.cur{filter:none;outline:3px solid #fbbf24;outline-offset:3px;border-radius:50%}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.oc{border:2px solid var(--line);border-radius:16px;padding:12px 10px;background:rgba(0,0,0,.3);font-weight:800;text-align:center;line-height:1.3}
.oc .e{font-size:34px;display:block}.oc:hover:not(:disabled){border-color:#a5b4fc;background:rgba(99,102,241,.2)}
.oc.good{border-color:var(--ok);background:rgba(16,185,129,.28)}.oc.no{border-color:var(--bad);background:rgba(244,63,94,.25)}
.tag{display:inline-block;margin:6px 0;border-radius:99px;padding:5px 14px;font-weight:900;background:rgba(251,191,36,.2);border:2px solid #fbbf24}
.qh{font-weight:900;font-size:18px;text-align:center;margin:8px 0}
.conf{position:absolute;top:-20px;font-size:26px;animation:cf 2.6s linear forwards}
@keyframes cf{to{transform:translateY(460px) rotate(360deg);opacity:.9}}
.hide{display:none!important}
.idle{animation:bobi 1.6s ease-in-out infinite}@keyframes bobi{50%{transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌉 Digital Divide</h1>
  <p class="sub">Book E · Ch.2 Health and Ethical Issues · 2.6 digital equity and digital divide</p>
  <div class="panel" id="stage"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var st = $('#stage'), timers = [], raf = 0;
  function clearAll() { timers.forEach(function (t) { clearTimeout(t); clearInterval(t); }); timers = []; cancelAnimationFrame(raf); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function bot(msg, small) { return '<div class="say"><div class="bot">🤖</div><div class="bub">' + msg + (small ? '<small>' + small + '</small>' : '') + '</div></div>'; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function shake() { st.classList.add('shake'); setTimeout(function () { st.classList.remove('shake'); }, 400); }
  function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  var CAUSE = { age: ['👵', 'Age'], inc: ['💰', 'Household income'], loc: ['🏔️', 'Geographical location'], dis: ['♿', 'Disability'], lang: ['🗣️', 'Race and language'] };
  var HELP = {
    train: ['🎓', 'Free IT training courses'], sub: ['💸', 'Subsidy for Internet and computers'], wifi: ['📡', 'Free public Wi-Fi and network upgrades'],
    assist: ['🦯', 'Assistive technology: screen reader and image descriptions'], multi: ['🌐', 'Websites and apps in many languages']
  };
  var PEOPLE = [
    { n: 'Grandma Mei', face: '👵', cause: 'age', help: 'train', bub: '📱❓', say: 'I do not know how to use apps or mobile payment…', ok: 'Now she shops and pays online!', skin: '#fcd9b6', hair: '#d1d5db', shirt: '#a855f7', pants: '#475569', ty: 'granny' },
    { n: 'Ling', face: '👧', cause: 'inc', help: 'sub', bub: '💻❌ 📶❌', say: 'My family shares one old phone and cannot afford home Internet.', ok: 'Ling joins the school online quiz from home!', skin: '#fcd9b6', hair: '#111827', shirt: '#38bdf8', pants: '#1e3a8a', ty: 'ling' },
    { n: 'Farmer Wong', face: '👨‍🌾', cause: 'loc', help: 'wifi', bub: '📡❌', say: 'My remote village has no good Internet signal.', ok: 'The village is online at last!', skin: '#e0a46b', hair: '#1f2937', shirt: '#84cc16', pants: '#78350f', ty: 'farmer' },
    { n: 'Kai', face: '🧑‍🦯', cause: 'dis', help: 'assist', bub: '🖼️❓', say: 'I am blind. The website pictures say nothing to me.', ok: 'Kai’s screen reader reads the whole page!', skin: '#fcd9b6', hair: '#1f2937', shirt: '#f97316', pants: '#334155', ty: 'kai' },
    { n: 'Maria', face: '👩🏾', cause: 'lang', help: 'multi', bub: '🔤❓', say: 'I just arrived. Every website is in a language I cannot read.', ok: 'Maria can read the website in her language!', skin: '#a16240', hair: '#1c1917', shirt: '#ec4899', pants: '#4c1d95', ty: 'maria' }
  ];

  /* ---------- the scene ---------- */
  function person(c, x, y, o) {
    var sw = o.walking ? Math.sin(o.t * 16) * 7 : 0, s = '', sad = !o.happy, hx = x, hy = y - 70;
    s += '<g' + (o.walking || o.happy ? '' : ' class="idle"') + '>';
    s += '<line x1="' + (x - 5) + '" y1="' + (y - 22) + '" x2="' + (x - 5 + sw) + '" y2="' + y + '" stroke="' + c.pants + '" stroke-width="7" stroke-linecap="round"/><line x1="' + (x + 5) + '" y1="' + (y - 22) + '" x2="' + (x + 5 - sw) + '" y2="' + y + '" stroke="' + c.pants + '" stroke-width="7" stroke-linecap="round"/>';
    if (c.ty === 'granny') s += '<line x1="' + (x + 17) + '" y1="' + (y - 34) + '" x2="' + (x + 21 + sw / 2) + '" y2="' + y + '" stroke="#92400e" stroke-width="3.5" stroke-linecap="round"/>';
    if (c.ty === 'kai') s += '<line x1="' + (x + 16) + '" y1="' + (y - 32) + '" x2="' + (x + 38 + sw) + '" y2="' + (y + 1) + '" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/><circle cx="' + (x + 38 + sw) + '" cy="' + (y) + '" r="3" fill="#ef4444"/>';
    if (c.ty === 'farmer') s += '<line x1="' + (x + 17) + '" y1="' + (y - 70) + '" x2="' + (x + 17) + '" y2="' + y + '" stroke="#92400e" stroke-width="3"/><path d="M' + (x + 10) + ' ' + (y - 70) + ' h14 l-3 6 h-8z" fill="#9ca3af"/>';
    s += '<rect x="' + (x - 12) + '" y="' + (y - 60) + '" width="24" height="40" rx="9" fill="' + c.shirt + '"/>';
    s += '<line x1="' + (x - 11) + '" y1="' + (y - 52) + '" x2="' + (x - 17 - sw / 3) + '" y2="' + (y - 33) + '" stroke="' + c.shirt + '" stroke-width="6" stroke-linecap="round"/><line x1="' + (x + 11) + '" y1="' + (y - 52) + '" x2="' + (x + 17 + sw / 3) + '" y2="' + (y - 33) + '" stroke="' + c.shirt + '" stroke-width="6" stroke-linecap="round"/>';
    if (c.ty === 'ling') s += '<rect x="' + (x - 24) + '" y="' + (y - 44) + '" width="9" height="14" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/><path d="M' + (x - 22) + ' ' + (y - 42) + ' l4 6 l-3 4" stroke="#fca5a5" stroke-width="1" fill="none"/>';
    /* head */

    h.innerHTML = '<div class="shopx">✍️ <b>Describe each picture</b> so that Kai can “see” it. Write what the picture tells people.<div id="ds">' + PICS.map(function (p, i) { return '<div class="dsr"><div class="wi small">' + p[0] + '<small>' + p[1] + '</small></div><input type="text" maxlength="90" data-i="' + i + '" placeholder="Describe ' + p[2] + '…" aria-label="Description of ' + p[2] + '"></div>'; }).join('') + '</div><div class="err" id="er"></div><div class="row"><button class="btn" id="on">🔊 Turn on the screen reader</button></div><div class="reader" id="rd"></div></div>';
    $('#on').onclick = function () {
      var v = [].map.call(h.querySelectorAll('input'), function (x) { return x.value.trim(); }); if (v.some(function (t) { return t.length < 10; })) { $('#er').textContent = 'Write at least 10 letters for every picture.'; return; } $('#er').textContent = '';
      $('#on').disabled = true; $('#rd').innerHTML = v.map(function (t) { return '🔊 “image: ' + esc(t) + '”'; }).join('<br>') + '<br>😀 <b>Kai can understand the whole page now!</b>'; lt(done, 2400);
    };
  }

  /* 5. Maria: guess the buttons, then switch language */
  var LANGS = { zh: ['中文', '疫苗預約', '預約', '取消預約', '刪除我的資料'], en: ['English', 'Vaccine booking', 'Book appointment', 'Cancel appointment', 'Delete my data'], fil: ['Filipino', 'Pagpapabakuna', 'Mag-book ng appointment', 'Kanselahin', 'Burahin ang data ko'], ja: ['日本語', 'ワクチン予約', '予約する', 'キャンセル', 'データを削除'], fr: ['Français', 'Réservation du vaccin', 'Réserver', 'Annuler', 'Supprimer mes données'] };
  function g5a(h, done) {
    var order = shuffle([2, 3, 4]), used = false, L = LANGS.zh;
    h.innerHTML = '<div class="shopx">🗨️ <b>You are Maria.</b> “I want to <b>book a vaccine appointment</b> for my child.” Choose a button.<div class="web"><div class="wt"><b>🏥 ' + L[1] + '</b></div>' + order.map(function (k) { return '<button class="webbtn" data-k="' + k + '">' + L[k] + '</button>'; }).join('') + '</div><div class="msg" id="gm">You cannot read the buttons… tap one!</div></div>';
    [].forEach.call(h.querySelectorAll('.webbtn'), function (b) {
      b.onclick = function () {
        var k = +b.dataset.k; shake(); setMsg($('#gm'), k === 2 ? '🍀 Lucky guess! It said “Book appointment”. But Maria could not have known.' : k === 3 ? '😱 Oops! That said “Cancel appointment”. Her old booking is gone!' : '😱 Oops! That said “Delete my data”. Her account is erased!', k === 2 ? 'good' : 'no');
        if (!used) { used = true; contBtn(h, '🔍 What went wrong?', done); }
      };
    });
  }
  function g5b(h, done) {
    var lang = 'zh', ok = false;
    h.innerHTML = '<div class="shopx">🌐 <b>Maria says: “I can read English or Filipino.”</b> Use the language menu.<div class="langs" id="lg">' + Object.keys(LANGS).map(function (k) { return '<button class="chp" data-l="' + k + '">' + LANGS[k][0] + '</button>'; }).join('') + '</div><div class="web" id="pg"></div><div class="msg" id="gm">Pick a language.</div></div>';
    function page() { var L = LANGS[lang]; $('#pg').innerHTML = '<div class="wt"><b>🏥 ' + L[1] + '</b></div><button class="webbtn" id="bk">' + L[2] + '</button>'; $('#bk').onclick = function () { if (!ok) { shake(); setMsg($('#gm'), '❓ Maria cannot read this page yet.', 'no'); return; } $('#bk').disabled = true; setMsg($('#gm'), '🎉 Maria booked the appointment all by herself!', 'good'); lt(done, 1300); }; }
    page();
    [].forEach.call(h.querySelectorAll('#lg .chp'), function (b) { b.onclick = function () { lang = b.dataset.l; ok = lang === 'en' || lang === 'fil'; [].forEach.call(h.querySelectorAll('#lg .chp'), function (x) { x.classList.remove('good', 'no'); }); b.classList.add(ok ? 'good' : 'no'); page(); setMsg($('#gm'), ok ? '😊 Now Maria can read it! Tap the Book button.' : '❓ Maria cannot read this language. Try another.', ok ? 'good' : 'no'); if (!ok) shake(); }; });
  }
  var GAMES = [[g1a, g1b], [g2a, g2b], [g3a, g3b], [g4a, g4b], [g5a, g5b]];

  /* ---------- game flow ---------- */
  var done = {};
  function dots(cur) { return '<div class="dotsr">' + PEOPLE.map(function (p, i) { return '<span class="' + (done[i] ? 'on' : '') + (i === cur ? ' cur' : '') + '">' + p.face + '</span>'; }).join('') + '</div>'; }
  function intro() {
    clearAll(); done = {};
    st.innerHTML = bot('There is a <b>gap</b> between these people and the digital world. 🌉', 'Find out what blocks each person, then help them one by one!') + '<div class="stagebox" id="sb"></div><div class="row" style="justify-content:center"><button class="btn" id="go">▶ Meet the first person</button></div>';
    $('#sb').innerHTML = scene(PEOPLE[0], { bridge: 0, walk: 0, conn: 0, t: 0, bubble: PEOPLE[0].bub });
    $('#go').onclick = function () { round(0); };
  }
  function round(i) {
    clearAll(); var c = PEOPLE[i];
    st.innerHTML = dots(i) + '<div class="who"><span class="wf">' + c.face + '</span><div class="wq"><b>' + esc(c.n) + '</b><br>“' + esc(c.say) + '”</div></div><div id="game"></div>';
    var h = $('#game');
    h.innerHTML = '<div class="stagebox" id="sb"></div>'; $('#sb').innerHTML = scene(c, { bridge: 0, walk: 0, conn: 0, t: 0, bubble: c.bub });
    contBtn(h, '🔍 Find out the problem', function () { h.innerHTML = ''; GAMES[i][0](h, diagnose); });
    function diagnose() {
      h.innerHTML = '<div class="diag"><div class="qh">Problem found!</div><div class="tri">' + TRI.map(function (t, k) { var bad = c.miss.indexOf(t[0]) >= 0; return '<div class="tc ' + (bad ? 'bad' : 'okc') + '" style="animation-delay:' + (k * 0.25) + 's"><span class="e">' + t[1] + '</span>' + t[2] + '<b>' + (bad ? '✘' : '✔') + '</b></div>'; }).join('') + '</div><div style="text-align:center"><span class="tag">' + CAUSE[c.cause][0] + ' ' + esc(c.why) + '</span></div></div>';
      contBtn(h, '🛠️ Help ' + esc(c.n), function () { h.innerHTML = ''; GAMES[i][1](h, reward); });
    }
    function reward() {
      h.innerHTML = '<div class="stagebox" id="sb"></div><div class="qh" id="say">🔨 Building the bridge…</div>';
      function draw(q) { $('#sb').innerHTML = scene(c, q); }
      anim(1800, function (t, now) { draw({ bridge: ease(t), walk: 0, conn: 0, t: now, bubble: c.bub, happy: false, help: HELP[c.help][0] }); }, function () {
        $('#say').textContent = '🚶 Crossing…';
        anim(2400, function (t, now) { draw({ bridge: 1, walk: ease(t), conn: t > .85 ? 1 : 0, t: now, bubble: t > .85 ? '😊' : null, happy: t > .85 }); }, function () {
          done[i] = 1; draw({ bridge: 1, walk: 1, conn: 1, t: 0, bubble: '😊', happy: true }); conf($('#sb')); $('#say').textContent = '🎉 ' + c.ok;
          contBtn(h, i < 4 ? 'Next person ▶' : 'See everyone ▶', function () { i < 4 ? round(i + 1) : finale(); });
        });
      });
    }
  }
  function finale() {
    clearAll(); if (window.ICTGameDone) try { window.ICTGameDone(); } catch (e) {}
    var s = '<svg viewBox="0 0 420 270" role="img" aria-label="Everyone has crossed the bridge"><rect width="420" height="270" fill="#14204a"/><rect x="0" y="200" width="420" height="70" fill="#52525b"/><rect x="0" y="200" width="420" height="8" fill="#22d3ee"/>';
    [[10, 150, 26, 50], [60, 118, 30, 82], [330, 140, 26, 60], [380, 108, 24, 92]].forEach(function (b) { s += '<rect x="' + b[0] + '" y="' + b[1] + '" width="' + b[2] + '" height="' + b[3] + '" fill="#1e293b"/>'; for (var yy = b[1] + 8; yy < 196; yy += 14) s += '<rect x="' + (b[0] + 6) + '" y="' + yy + '" width="5" height="7" fill="#fde047"/>'; });
    ['🏦', '🛒', '🏫', '💼', '📰', '🏥'].forEach(function (e, i) { s += '<text x="' + (40 + i * 68) + '" y="' + (50 + (i % 2) * 24) + '" font-size="26" text-anchor="middle">' + e + '</text>'; });
    PEOPLE.forEach(function (c, i) { s += person(c, 60 + i * 75, 200, { happy: true, t: 0, bubble: i % 2 ? '😊' : '📶' }); });
    s += '</svg>';
    st.innerHTML = bot('Everyone is connected! 🎉', 'This is what <b>digital equity</b> looks like.') + '<div class="stagebox" id="sb">' + s + '</div><p style="text-align:center;font-weight:800;color:#6ee7b7">🎮 Game complete! +10 XP added to Book E on your world map.</p>' +
      '<div class="note"><b>Digital divide</b> = the gap between people in access to <b>ICT hardware</b>, <b>Internet access</b> and <b>ICT knowledge</b>. <b>Digital equity</b> = everyone has fair access to technology so they can take part in society. Ignoring the divide isolates people from daily services and makes them less competitive in the job market.</div>' +
      '<div class="note" style="background:rgba(99,102,241,.14);border-color:rgba(129,140,248,.5)"><b>You helped with:</b> training courses (age), subsidies and computers for students in need (income), free Wi-Fi and network upgrades (location), assistive technology and image descriptions (disability), and websites in many languages (race and language).</div>' +
      '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn sec" id="rw">🌉 Play again</button><a class="btn sec" style="text-decoration:none" href="mindmap.html">🧠 Ch.2 mind map</a><a class="btn sec" style="text-decoration:none" href="../../mctrainer.html">🎯 MC Trainer</a></div>';
    conf($('#sb')); $('#rw').onclick = intro;
  }
  intro();
})();
</script>
<script src="../../nav.js"></script>
