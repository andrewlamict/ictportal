<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Data Lab</title>
<style>
:root{color-scheme:dark;--bg:#0b1226;--panel:#162044;--line:rgba(255,255,255,.18);--txt:#f8fafc;--mut:#cbd5e1;--vol:#60a5fa;--vor:#34d399;--vel:#fbbf24;--ver:#c084fc;--bad:#fb7185;--ok:#34d399}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);background:radial-gradient(900px 500px at 12% -10%,#1e3a8a 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#581c87 0,transparent 55%),var(--bg);min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 90px}
h1{margin:6px 0 2px;font-size:28px}h2{margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 14px;line-height:1.5}
.panel{position:relative;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:20px;padding:20px;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 8px 20px rgba(99,102,241,.4)}
.btn:hover:not(:disabled){filter:brightness(1.12)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:rgba(255,255,255,.14);box-shadow:none}.btn.red{background:linear-gradient(135deg,#ef4444,#f97316)}
.btn.sm{padding:8px 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Bytey */
.say{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.bot{font-size:46px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(3deg)}}
.bub{background:#fff;color:#0f172a;border-radius:6px 18px 18px 18px;padding:10px 14px;font-weight:700;line-height:1.45;max-width:640px}
.bub small{display:block;color:#475569;font-weight:600;margin-top:3px}
/* menu */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.tile{text-align:left;border-radius:18px;padding:16px;border:2px solid var(--line);background:rgba(0,0,0,.25);transition:.15s}
.tile:hover{transform:translateY(-3px);border-color:#a5b4fc}
.tile .e{font-size:34px}.tile b{display:block;font-size:17px;margin:4px 0 2px}.tile span{font-size:13px;color:var(--mut)}
.tile.done{border-color:var(--ok);background:rgba(16,185,129,.12)}
.tile .st{float:right;font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;background:rgba(255,255,255,.14)}
.tile.done .st{background:var(--ok);color:#052e1d}
.nb{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.nbc{border-radius:14px;padding:10px 12px;border:2px dashed var(--line);font-size:13.5px;color:var(--mut);min-height:84px}
.nbc.on{border-style:solid;color:var(--txt);background:rgba(0,0,0,.28)}
.nbc b{display:block;font-size:16px}
.c-vol{border-color:var(--vol)!important}.c-vol b{color:var(--vol)}
.c-vor{border-color:var(--vor)!important}.c-vor b{color:var(--vor)}
.c-vel{border-color:var(--vel)!important}.c-vel b{color:var(--vel)}
.c-ver{border-color:var(--ver)!important}.c-ver b{color:var(--ver)}
/* sheet */
.sheet{width:100%;border-collapse:collapse;background:#f8fafc;color:#0f172a;font-size:13px;border-radius:10px;overflow:hidden}
.sheet th{background:#16a34a;color:#fff;padding:6px 8px;text-align:left}.sheet td{padding:5px 8px;border-bottom:1px solid #e2e8f0}
.sheetbar{display:flex;justify-content:space-between;background:#166534;color:#fff;padding:6px 10px;font-size:13px;font-weight:700;border-radius:10px 10px 0 0}
.meter{height:14px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34d399,#fbbf24,#ef4444);transition:width .3s}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-weight:800}.stats span{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 12px}
.crash{position:absolute;inset:0;background:rgba(15,5,20,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;animation:glitch .5s;z-index:5}
.crash .big{font-size:60px}
@keyframes glitch{0%{transform:translateX(-8px)}20%{transform:translateX(8px)}40%{transform:translateX(-6px)}60%{transform:translateX(6px)}100%{transform:none}}
.shake{animation:glitch .4s}
/* import */
.items{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.item{border:2px solid var(--line);background:rgba(0,0,0,.3);border-radius:14px;padding:10px 14px;font-weight:700}
.item.sel{border-color:#fbbf24;background:rgba(251,191,36,.2);transform:scale(1.05)}.item.tried{opacity:.5;text-decoration:line-through}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.col{border-radius:12px;border:2px solid #86efac;background:#f0fdf4;color:#14532d;padding:12px;font-weight:800;text-align:center}
.col small{display:block;font-weight:600;color:#166534}
.msg{min-height:44px;margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(251,113,133,.15);border:1px solid rgba(251,113,133,.5);font-weight:700}
/* belt */
.belt{position:relative;height:210px;border-radius:16px;background:repeating-linear-gradient(90deg,#1e293b 0 28px,#243049 28px 56px);border:2px solid #475569;overflow:hidden}
.pk{position:absolute;top:80px;width:54px;height:54px;border-radius:12px;background:#fff;color:#0f172a;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #6366f1;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.pk:hover{border-color:#fbbf24}
.pk.gone{opacity:0;transform:scale(1.6);transition:.3s}
.tool{position:absolute;right:0;top:0;bottom:0;width:64px;background:rgba(239,68,68,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;writing-mode:vertical-rl;letter-spacing:.1em}
/* readings */
.rd{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.rdc{border-radius:12px;padding:10px;background:rgba(0,0,0,.3);border:2px solid var(--line);font-weight:800;text-align:center}
.rdc.bad:hover{border-color:var(--bad)}.rdc.gone{opacity:.25;text-decoration:line-through}
.avg{font-size:30px;font-weight:900}
.q{margin:12px 0;display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.28);font-weight:700;line-height:1.4}
.opt:hover:not(:disabled){border-color:#a5b4fc;background:rgba(99,102,241,.2)}
.opt.good{border-color:var(--ok);background:rgba(16,185,129,.25)}.opt.no{border-color:var(--bad);background:rgba(244,63,94,.25)}
.stamp{margin:12px 0;padding:16px;border-radius:18px;border:3px solid;text-align:center;animation:stamp .5s}
.stamp .big{font-size:40px;font-weight:900}
@keyframes stamp{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
textarea{width:100%;min-height:64px;margin-top:6px;padding:10px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-size:14.5px}
.cards{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.num{min-width:54px;height:54px;border-radius:12px;border:3px solid #6366f1;background:#fff;color:#0f172a;font-weight:900;font-size:19px;padding:0 8px}
.num.sel{border-color:#fbbf24;background:#fef3c7;transform:translateY(-6px)}.more{color:var(--mut);font-weight:700}
.scene{background:#fff;color:#0f172a;border-radius:12px;padding:12px 14px;line-height:1.7;font-weight:600}
.map{display:flex;justify-content:space-around;background:#d1fae5;border-radius:10px;padding:14px;margin-bottom:6px;font-weight:800}.pin{background:#fecaca;border-radius:8px;padding:2px 8px}
.wave{font-size:26px;letter-spacing:2px;color:#6366f1}.frames{display:flex;gap:8px;margin-bottom:6px}.frames span{flex:1;background:#0f172a;color:#fff;border-radius:8px;padding:8px;text-align:center;font-size:13px}
.board{display:flex;gap:8px;flex-wrap:wrap;min-height:40px}.pinned{background:rgba(251,191,36,.2);border:2px solid #fbbf24;border-radius:10px;padding:6px 12px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.phone{border:3px solid var(--line);border-radius:18px;background:rgba(0,0,0,.28);padding:16px;text-align:center}
.phone:hover:not(:disabled){border-color:#a5b4fc}.phone.pick{border-color:#fbbf24}.phone small{color:var(--mut)}
.reviews{display:grid;gap:8px;margin:10px 0}.rev{text-align:left;border:2px solid var(--line);border-radius:14px;background:rgba(0,0,0,.28);padding:10px 12px;line-height:1.45}
.rev span{margin-right:6px}.rev small{display:block;color:var(--mut);font-weight:600}.rev:hover{border-color:#a5b4fc}.rev.gone{opacity:.3;text-decoration:line-through}.rev.no{border-color:var(--bad);background:rgba(244,63,94,.2)}
.mailroom{position:relative;height:190px;border-radius:16px;background:linear-gradient(180deg,#1e293b,#334155);border:2px solid #475569;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:10px 0}
.parcel{background:#fde68a;color:#451a03;border-radius:14px;padding:12px 22px;text-align:center;font-weight:700;line-height:1.5;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.bins3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dbin{border:3px solid;border-radius:14px;background:rgba(0,0,0,.3);padding:16px 6px;font-weight:900;font-size:17px}
.dbin:hover{filter:brightness(1.3);transform:translateY(-3px)}
.fall{position:absolute;font-size:34px;top:-50px;animation:drop 1.1s ease-in forwards}
@keyframes drop{to{top:calc(100% - 44px);transform:rotate(18deg)}}
.mailroom.buried .parcel{opacity:.25}
.hide{display:none!important}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.5);font-size:14.5px;line-height:1.55}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔬 Big Data Lab</h1>
  <p class="sub">Book E · Ch.1 Technological Innovations · 1.1 AI and data science</p>
  <div class="panel" id="stage"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var V = {
    vol: { n: 'Volume', c: 'c-vol', hex: '#60a5fa', e: '📦', d: 'how MUCH data: the data keeps growing and has to be stored and processed.' },
    vor: { n: 'Variety', c: 'c-vor', hex: '#34d399', e: '🎭', d: 'how MANY KINDS of data: audio, image, video, text, location, and from many sources that must be integrated.' },
    vel: { n: 'Velocity', c: 'c-vel', hex: '#fbbf24', e: '⚡', d: 'how FAST data is generated and has to be analysed.' },
    ver: { n: 'Veracity', c: 'c-ver', hex: '#c084fc', e: '🕵️', d: 'how ACCURATE the data is: uncertainty, accuracy and quality of the data.' }
  };
  var EXP = [
    { k: 'vol', e: '📮', t: 'The mail room', s: 'Sort parcels into district bins: 5, 10, then 100,000.' },
    { k: 'vor', e: '🕵️', t: 'The detective case', s: 'Prove where Ben was using many kinds of evidence.' },
    { k: 'vel', e: '🏭', t: 'The conveyor belt', s: 'Analyse the data as it arrives.' },
    { k: 'ver', e: '📱', t: 'Which phone?', s: 'Choose a phone from online ratings. Can you trust them?' }
  ];
  var PROBLEMS = {
    vol: 'There was far too much data to store and process',
    vor: 'The data came in many different formats the table could not hold',
    vel: 'The data arrived faster than it could be analysed',
    ver: 'The data could not be trusted, so the result was wrong'
  };
  var TEST = [
    ['vol', 'A social network stores billions of posts every year.'], ['vol', 'The growing pile of data from millions of IoT detectors must be stored.'],
    ['vor', 'Audio, images, video, text and location data all sit in one system.'], ['vor', 'A company combines data from websites, sensors and mobile apps.'],
    ['vel', 'Live traffic conditions are sent by drivers every second.'], ['vel', 'A spam filter must check each email the moment it arrives.'],
    ['ver', '47% of email is spam, so a lot of the data is useless.'], ['ver', 'Fake reviews are mixed with real ones in the data set.']
  ];
  var found = {}, notes = {}, st = $('#stage');
  try { var sv = JSON.parse(localStorage.getItem('ictBigData') || '{}'); found = sv.found || {}; notes = sv.notes || {}; } catch (e) {}
  var save = function () { try { localStorage.setItem('ictBigData', JSON.stringify({ found: found, notes: notes })); } catch (e) {} };
  var timers = []; function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearAll() { timers.forEach(function (t) { clearTimeout(t); clearInterval(t); }); timers = []; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function bytey(msg, small) { return '<div class="say"><div class="bot">🤖</div><div class="bub">' + msg + (small ? '<small>' + small + '</small>' : '') + '</div></div>'; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function count() { return Object.keys(found).length; }

  /* ================= menu ================= */
  function menu() {
    clearAll(); var n = count();
    st.innerHTML = bytey(n ? (n === 4 ? 'You found all four! Ready for the final test?' : 'Nice work, analyst! ' + (4 - n) + ' experiment' + (4 - n > 1 ? 's' : '') + ' left.') : "Hi! I'm <b>Bytey</b>, your intern. Big data? Easy! We'll just use our normal tools. What could possibly go wrong? 😄", n ? '' : 'Run the 4 experiments. When something breaks, work out WHY. That is how you discover the 4 Vs of big data.') +
      '<div class="tiles">' + EXP.map(function (x, i) { var d = found[x.k]; return '<button class="tile ' + (d ? 'done' : '') + '" data-exp="' + i + '"><span class="st">' + (d ? '✔ ' + V[x.k].n : 'Experiment ' + (i + 1)) + '</span><div class="e">' + x.e + '</div><b>' + x.t + '</b><span>' + x.s + '</span></button>'; }).join('') + '</div>' +
      '<h3 style="margin:16px 0 8px">📓 My 4V notebook</h3><div class="nb">' + Object.keys(V).map(function (k) { var v = V[k], on = found[k]; return '<div class="nbc ' + (on ? 'on ' + v.c : '') + '">' + (on ? '<b>' + v.e + ' ' + v.n + '</b>' + esc(v.d) + (notes[k] ? '<br><i style="color:#fde68a">“' + esc(notes[k]) + '”</i>' : '') : '<b>? ? ?</b>Not discovered yet') + '</div>'; }).join('') + '</div>' +
      '<div class="row" style="margin-top:16px"><button class="btn red" id="final" ' + (n < 4 ? 'disabled' : '') + '>' + (n < 4 ? '🔒 Final test (find all 4 first)' : '🏆 Final test') + '</button></div>';
    $('#final').onclick = finalTest;
    [].forEach.call(st.querySelectorAll('[data-exp]'), function (b) { b.onclick = function () { [exp1, exp2, exp3, exp4][+b.dataset.exp](); }; });
  }

  function crash(host, icon, title, text, cb) {
    var c = document.createElement('div'); c.className = 'crash';
    c.innerHTML = '<div class="big">' + icon + '</div><h2>' + title + '</h2><p style="max-width:460px;line-height:1.5;margin:0">' + text + '</p><button class="btn red" id="why">🤔 Why did that happen?</button>';
    host.appendChild(c); $('#why', c).onclick = cb;
  }
  var DISC = {
    vol: { q: 'Why could you not finish sorting the 100,000 parcels?', o: { vol: 'There were far too many parcels (too much data) to handle one by one', vor: 'The parcels were all different types and shapes', vel: 'The parcels were sent out too slowly', ver: 'The addresses on the parcels were wrong' } },
    vor: { q: 'Why could the old case table not prove the case?', o: { vol: 'There was too much evidence to store', vor: 'The evidence came in many different formats (photo, audio, video, location) that the table could not hold', vel: 'The evidence arrived too quickly', ver: 'All of the evidence was fake' } },
    vel: { q: 'Why did the conveyor belt jam?', o: { vol: 'There were too many packets in total to store', vor: 'The packets were in different formats', vel: 'The packets arrived faster than we could analyse them', ver: 'The packets contained wrong information' } },
    ver: { q: 'Why did Phone A look so much better than it really was?', o: { vol: 'There were too many reviews to read', vor: 'The reviews came in different formats', vel: 'The ratings changed every second', ver: 'Many reviews were fake, so the data could not be trusted' } }
  };
  function discover(k) {                                 /* activity-specific question, then reveal the V */
    clearAll(); var D = DISC[k], opts = shuffle(Object.keys(D.o));
    st.innerHTML = bytey('Think about what just happened. 🤔', D.q) +
      '<div class="q">' + opts.map(function (o) { return '<button class="opt" data-o="' + o + '">' + D.o[o] + '</button>'; }).join('') + '</div><div id="rev"></div>';
    [].forEach.call(st.querySelectorAll('.opt'), function (b) {
      b.onclick = function () {
        if (b.dataset.o !== k) { b.classList.add('no'); st.classList.add('shake'); setTimeout(function () { st.classList.remove('shake'); }, 400); $('#rev').innerHTML = '<p class="sub">Not quite. Remember what you saw in the activity and try again.</p>'; return; }
        [].forEach.call(st.querySelectorAll('.opt'), function (x) { x.disabled = true; }); b.classList.add('good'); found[k] = 1; save(); var v = V[k];
        $('#rev').innerHTML = '<div class="stamp ' + v.c + '" style="background:rgba(0,0,0,.3)"><div style="font-size:15px;color:var(--mut)">You discovered…</div><div class="big" style="color:' + v.hex + '">' + v.e + ' ' + v.n.toUpperCase() + '</div><div style="font-size:16px;line-height:1.5;margin-top:4px">' + v.n + ' = ' + esc(v.d) + '</div></div>' +
          '<label for="mine" style="font-weight:800">✍️ Write it in your own words (for your notebook)</label><textarea id="mine" maxlength="140" placeholder="e.g. ' + v.n + ' means…"></textarea>' +
          '<div class="row" style="margin-top:12px"><button class="btn" id="back">📓 Save to notebook</button></div>';
        $('#back').onclick = function () { notes[k] = $('#mine').value.trim(); save(); menu(); };
      };
    });
  }

  /* ================= experiment 1: volume (mail room) ================= */
  function exp1() {
    clearAll(); var rounds = [5, 10, 100000], ri = 0, DIST = [['N', 'North', '#60a5fa'], ['S', 'South', '#34d399'], ['E', 'East', '#fbbf24']], names = ['Amy', 'Ben', 'Cathy', 'David', 'Eva', 'Frank', 'Gigi', 'Hugo', 'Ivy', 'Jack', 'Kai', 'Lily'];
    function round() {
      var n = rounds[ri], big = n > 20, total = n, left = n, t0 = Date.now(), cur = null, sorted = 0, over = false;
      function newP() { var d = DIST[Math.floor(Math.random() * 3)]; cur = { d: d, to: names[Math.floor(Math.random() * names.length)] }; $('#parcel').innerHTML = '<div style="font-size:46px">📦</div><b>To: ' + cur.to + '</b><br>District: <b style="color:#0f172a">' + d[1] + '</b>'; }
      function avalanche() {
        over = true; var f = $('#field'); f.classList.add('buried'); var h = '';
        for (var i = 0; i < 90; i++) h += '<span class="fall" style="left:' + Math.random() * 96 + '%;animation-delay:' + (Math.random() * 1.6).toFixed(2) + 's;bottom:' + (Math.random() * 70).toFixed(0) + 'px">📦</span>';
        f.insertAdjacentHTML('beforeend', h); $('#left').textContent = '99,997'; $('#bins').classList.add('hide');
        later(function () { crash($('#stage'), '📦', 'The pile is taking over the room!', 'There are 99,997 parcels left. At one parcel per second that is over <b>27 hours non-stop</b>, and that is just one delivery. A person with a normal way of working cannot handle this much data.', function () { discover('vol'); }); }, 2600);
      }
      st.innerHTML = bytey(big ? 'Round 3: 🚚 <b>BIG DELIVERY!</b> 100,000 parcels just arrived. Get sorting!' : 'Round ' + (ri + 1) + ': you work in the mail room 📮. Sort ' + n + ' parcels into the right district bin.', big ? 'Same job as before. You can do it, right?' : 'Read the district on the parcel, then tap that bin.') +
        '<div class="stats"><span>Parcels left: <b id="left">' + n.toLocaleString() + '</b></span><span>Sorted: <b id="srt">0</b></span></div><div class="mailroom" id="field"><div class="parcel" id="parcel"></div></div><div class="bins3" id="bins">' + DIST.map(function (d) { return '<button class="dbin" data-d="' + d[0] + '" style="border-color:' + d[2] + ';color:' + d[2] + '">📮 ' + d[1] + '</button>'; }).join('') + '</div><div class="msg" id="msg" style="background:rgba(255,255,255,.08);border-color:var(--line)">Go!</div><button class="btn hide" id="nx">Next round ▶</button>';
      newP();
      [].forEach.call(st.querySelectorAll('.dbin'), function (b) {
        b.onclick = function () {
          if (over) return;
          if (b.dataset.d !== cur.d[0]) { st.classList.add('shake'); setTimeout(function () { st.classList.remove('shake'); }, 400); $('#msg').textContent = '❌ Wrong bin! That parcel is for the ' + cur.d[1] + ' district.'; return; }
          left--; sorted++; $('#left').textContent = left.toLocaleString(); $('#srt').textContent = sorted; $('#msg').textContent = '✔ Sorted!';
          if (big) { if (sorted >= 3) { avalanche(); return; } newP(); return; }
          if (left === 0) { over = true; $('#parcel').innerHTML = '<div style="font-size:46px">🎉</div><b>All done!</b>'; $('#bins').classList.add('hide'); var sec = Math.round((Date.now() - t0) / 1000); $('#msg').innerHTML = '✅ ' + n + ' parcels sorted in <b>' + sec + ' seconds</b>. Easy!'; $('#nx').classList.remove('hide'); return; }
          newP();
        };
      });
      $('#nx').onclick = function () { ri++; round(); };
    }
    round();
  }

  /* ================= experiment 2: variety (detective) ================= */
  function exp2() {
    clearAll();
    var EV = [
      { id: 'receipt', e: '🧾', n: 'Receipt', f: 'text', shown: '<div class="scene"><b>Mall Café</b><br>14:58 · 1 × milk tea · $28</div>' },
      { id: 'photo', e: '📷', n: 'Photo', f: 'image', shown: '<div class="scene"><div style="font-size:38px">🏬 <b style="background:#fde68a;color:#0f172a;padding:0 8px;border-radius:6px">MALL</b> ☔</div><div>🕒 clock on the wall: <b>3:01 pm</b></div><div>🧍 someone with a red umbrella</div></div>', q: 'What does the photo show?', o: ['A school gate at 8 am', 'A MALL sign and a clock showing 3:01 pm', 'A blurry picture that proves nothing'], a: 1 },
      { id: 'gps', e: '📍', n: 'GPS log', f: 'location', shown: '<div class="scene"><div class="map"><span>🏫 School</span><span class="pin">📍 Mall</span><span>🏠 Home</span></div><div>Phone location at <b>15:00</b>: the Mall</div></div>', q: 'Where was the phone at 3 pm?', o: ['At school', 'At the Mall', 'Switched off'], a: 1 },
      { id: 'voice', e: '🎤', n: 'Voice message', f: 'audio', shown: '<div class="scene"><div class="wave">▂▄▇▃▆▂▅▇▃▂▄▆▃▂</div><i>“…the rain is so heavy, I will wait inside the mall…”</i><div>sent at <b>15:04</b></div></div>', q: 'What does the voice message say?', o: ['He is at home doing homework', 'He is waiting inside the mall at 3:04 pm', 'He is asking about the exam'], a: 1 },
      { id: 'video', e: '🎬', n: 'CCTV video', f: 'video', shown: '<div class="scene"><div class="frames"><span>14:58<br>🚪</span><span>14:59<br>🧍➡️</span><span>15:00<br>🏬</span></div><div>CCTV at the Mall entrance: the same person walks in at <b>14:59</b></div></div>', q: 'What does the CCTV video show?', o: ['Nobody entered the Mall', 'A person walking into the Mall at 14:59', 'An empty street'], a: 1 }
    ];
    var tried = {}, pinned = {};
    st.innerHTML = bytey('Detective time! 🕵️ Case: <b>“Prove that Ben was at the Mall at 3 pm.”</b>', 'You have a normal case table that stores only text and numbers. Open each piece of evidence.') +
      '<div class="items" id="ev">' + EV.map(function (x) { return '<button class="item" data-id="' + x.id + '">' + x.e + ' ' + x.n + '<small style="display:block;font-weight:600;color:var(--mut)">' + x.f + '</small></button>'; }).join('') + '</div><div class="msg" id="m" style="background:rgba(255,255,255,.08);border-color:var(--line)">Open the evidence to see what the table can do.</div><div id="nxt"></div>';
    [].forEach.call(st.querySelectorAll('.item'), function (b) {
      b.onclick = function () {
        var x = EV.filter(function (e) { return e.id === b.dataset.id; })[0]; tried[x.id] = 1;
        if (x.f === 'text') { $('#m').innerHTML = '✔ Readable: ' + x.shown + 'But one receipt only shows the café, not Ben. It proves very little.'; }
        else { b.classList.add('tried'); $('#m').textContent = '❌ Unsupported format: the table cannot open ' + x.n.toLowerCase() + ' (' + x.f + ') files. It only stores text and numbers.'; st.classList.add('shake'); setTimeout(function () { st.classList.remove('shake'); }, 400); }
        if (Object.keys(tried).length === EV.length) $('#nxt').innerHTML = '<p class="sub">With only one readable receipt, the case cannot be proved. Open the big-data evidence room.</p><button class="btn" id="room">🔓 Open the evidence room</button>', $('#room').onclick = room;
      };
    });
    function room() {
      st.innerHTML = bytey('The evidence room reads <b>every</b> kind of data. Inspect each piece, then pin the clue that supports the case.', 'You need clues from different kinds of evidence to prove Ben was at the Mall at 3 pm.') +
        '<div class="items" id="ev">' + EV.slice(1).concat([EV[0]]).map(function (x) { return '<button class="item" data-id="' + x.id + '">' + x.e + ' ' + x.n + '</button>'; }).join('') + '</div><div id="view" class="panel" style="background:rgba(0,0,0,.25)">Pick a piece of evidence above.</div>' +
        '<h3 style="margin:14px 0 6px">📌 Case board: <span id="cnt">0</span> / 5 clues pinned</h3><div class="board" id="board"></div><div class="row" style="margin-top:12px"><button class="btn red" id="prove" disabled>⚖️ Prove the case</button></div>';
      [].forEach.call(st.querySelectorAll('.item'), function (b) {
        b.onclick = function () {
          var x = EV.filter(function (e) { return e.id === b.dataset.id; })[0], v = $('#view');
          v.innerHTML = x.shown + (x.q ? '<p style="font-weight:800;margin:10px 0 6px">' + x.q + '</p><div class="q">' + x.o.map(function (o, i) { return '<button class="opt" data-k="' + i + '">' + o + '</button>'; }).join('') + '</div>' : '<p class="sub">Text is the one format the old table could read.</p>' + (pinned[x.id] ? '' : '<button class="btn sm" id="pinr">📌 Pin this clue</button>'));
          function pin() { pinned[x.id] = x; var c = Object.keys(pinned).length; $('#cnt').textContent = c; $('#board').innerHTML = Object.keys(pinned).map(function (k) { return '<span class="pinned">' + pinned[k].e + ' ' + pinned[k].f + '</span>'; }).join(''); b.classList.add('tried'); b.style.textDecoration = 'none'; b.style.opacity = '1'; b.style.borderColor = 'var(--ok)'; if (c >= 4) $('#prove').disabled = false; }
          if (!x.q) { var pr = $('#pinr'); if (pr) pr.onclick = function () { pin(); v.innerHTML = '📌 Pinned!'; }; return; }
          [].forEach.call(v.querySelectorAll('.opt'), function (o) { o.onclick = function () { if (+o.dataset.k === x.a) { o.classList.add('good'); pin(); $('.q', v).insertAdjacentHTML('afterend', '<div class="msg" style="background:rgba(16,185,129,.18);border-color:#34d399">📌 Clue pinned to the board!</div>'); [].forEach.call(v.querySelectorAll('.opt'), function (z) { z.disabled = true; }); } else { o.classList.add('no'); st.classList.add('shake'); setTimeout(function () { st.classList.remove('shake'); }, 400); } }; });

        $('#why').onclick = function () { discover('vor'); };

  }

  /* ================= experiment 3: velocity ================= */
  function exp3() {
    clearAll(); var missed = 0, done = 0, busy = false, t0 = performance.now(), alive = true, pk = [], spawnEvery = 1500, nextSpawn = 0, last = performance.now();
    st.innerHTML = bytey('Experiment 3: data packets are arriving on the belt. Analyse each one before it reaches the end!', 'Tap a packet to analyse it. My normal analysis tool takes a moment for each one. 🐢') +
      '<div class="stats"><span>✅ Analysed: <b id="dn">0</b></span><span>⚠️ Out of date: <b id="ms">0</b> / 6</span></div><div class="meter"><i id="bz" style="background:#fbbf24"></i></div><div class="belt" id="belt"><div class="tool">OLD DATA</div></div>';
    var belt = $('#belt'), W = function () { return belt.clientWidth - 64; }, icons = ['📄', '📸', '📍', '💬', '🧾', '📈'];
    function lose() { if (!alive) return; alive = false; crash($('#stage'), '🏭', 'The belt is jammed!', 'The data arrived faster than we could analyse it. By the time we finished one packet, the results were already out of date.', function () { discover('vel'); }); }
    function frame(now) {
      if (!alive) return; var dt = Math.min(.05, (now - last) / 1000); last = now;
      var el = (now - t0) / 1000, speed = 60 + el * 5; spawnEvery = Math.max(380, 1500 - el * 50);
      if (now >= nextSpawn) { nextSpawn = now + spawnEvery; var d = document.createElement('button'); d.className = 'pk'; d.textContent = icons[Math.floor(Math.random() * icons.length)]; d.style.left = '-60px'; d.style.top = (14 + Math.random() * 130) + 'px'; belt.appendChild(d); var o = { el: d, x: -60 }; pk.push(o);
        d.onclick = function () { if (busy || !alive) return; busy = true; var bz = $('#bz'), w = 0; d.classList.add('gone'); o.dead = true; var iv = setInterval(function () { w += 10; bz.style.width = w + '%'; if (w >= 100) { clearInterval(iv); busy = false; bz.style.width = '0'; done++; $('#dn').textContent = done; } }, 90); timers.push(iv); }; }
      pk.forEach(function (o) { if (o.dead) return; o.x += speed * dt; o.el.style.left = o.x + 'px'; if (o.x > W()) { o.dead = true; o.el.remove(); missed++; $('#ms').textContent = missed; if (missed >= 6) lose(); } });
      pk = pk.filter(function (o) { return !o.dead; }); requestAnimationFrame(frame);
    }
    requestAnimationFrame(function (n) { last = n; nextSpawn = n + 600; frame(n); });
    timers.push({ stop: 1 }); var stopper = setInterval(function () { if (!document.getElementById('belt')) { alive = false; clearInterval(stopper); } }, 500); timers.push(stopper);
  }

  /* ================= experiment 4: veracity (which phone?) ================= */
  function exp4() {
    clearAll();
    st.innerHTML = bytey('Experiment 4: you run a phone shop 📱. You can stock <b>100</b> phones of ONE model. Choose using the online ratings!', 'The ratings come from 1,000 reviews each.') +
      '<div class="two"><button class="phone" data-p="A"><div style="font-size:44px">📱</div><b>Phone A</b><div class="avg" style="color:#fbbf24">4.6 ★</div><small>1,000 reviews</small></button><button class="phone" data-p="B"><div style="font-size:44px">📱</div><b>Phone B</b><div class="avg" style="color:#fbbf24">4.2 ★</div><small>1,000 reviews</small></button></div><div id="out"></div>';
    [].forEach.call(st.querySelectorAll('.phone'), function (b) {
      b.onclick = function () {
        [].forEach.call(st.querySelectorAll('.phone'), function (x) { x.disabled = true; }); b.classList.add('pick');
        $('#out').innerHTML = b.dataset.p === 'A'
          ? '<div class="msg">📦 A month later: <b>62 of 100 phones came back</b> as returns. Customers are angry and you lose <b>$24,800</b>. 😱</div><button class="btn" id="inv">🔍 Investigate Phone A’s 4.6 ★</button>'
          : '<div class="msg" style="background:rgba(16,185,129,.18);border-color:#34d399">💰 Phone B sells well. But why was Phone A rated so highly? Let us look at its reviews.</div><button class="btn" id="inv">🔍 Investigate Phone A’s 4.6 ★</button>';
        $('#inv').onclick = investigate;
      };
    });
    function investigate() {
      var R = [['⭐⭐⭐⭐⭐', 'Best phone ever!!!', 'account made today', 'posted 10:01', 'no purchase', 1], ['⭐⭐⭐', 'Battery is only ok, screen scratches easily.', 'account made 3 years ago', 'posted Tue 18:20', 'verified purchase', 0],
        ['⭐⭐⭐⭐⭐', 'Best phone ever!!!', 'account made today', 'posted 10:01', 'no purchase', 1], ['⭐⭐', 'Stopped working after 2 weeks.', 'account made 1 year ago', 'posted Sat 09:12', 'verified purchase', 0],
        ['⭐⭐⭐⭐⭐', 'Amazing, buy now, five stars!', 'account made today', 'posted 10:02', 'no purchase', 1], ['⭐⭐⭐⭐', 'Good camera but the phone heats up.', 'account made 2 years ago', 'posted Mon 21:45', 'verified purchase', 0],
        ['⭐⭐⭐⭐⭐', 'Best phone ever!!!', 'account made today', 'posted 10:02', 'no purchase', 1], ['⭐⭐⭐⭐⭐', 'Perfect!! Everyone must buy!!', 'account made today', 'posted 10:03', 'no purchase', 1],
        ['⭐⭐⭐', 'Average. Would not buy again.', 'account made 6 months ago', 'posted Thu 13:30', 'verified purchase', 0], ['⭐⭐⭐⭐⭐', 'Best phone ever!!!', 'account made today', 'posted 10:03', 'no purchase', 1]];
      var stars = function (r) { return (r[0].length / 1); }, flagged = {}, fakes = R.filter(function (r) { return r[5]; }).length;
      var real = R.filter(function (r) { return !r[5]; });
      function num(r) { return (r[0].match(/⭐/g) || []).length; }
      function avgOf(list) { return list.length ? (list.reduce(function (s, r) { return s + num(r); }, 0) / list.length).toFixed(1) : '–'; }
      function upd() { var keep = R.filter(function (r, i) { return !flagged[i]; }); $('#av').textContent = avgOf(keep); var done = R.every(function (r, i) { return !r[5] || flagged[i]; }); if (done) { $('#nxt').innerHTML = '<div class="stamp" style="border-color:#c084fc;background:rgba(0,0,0,.3)"><div class="big" style="color:#d8b4fe;font-size:26px">🕵️ GARBAGE IN, GARBAGE OUT</div><div style="line-height:1.55">Phone A’s real rating is only <b>' + avgOf(real) + ' ★</b>. Most of its 5-star reviews were fake. If the data cannot be trusted, the decision based on it is wrong. In the real data set, <b>80%</b> of Phone A’s 1,000 reviews were fake (an example for this game).</div></div><button class="btn red" id="why">🤔 Why did I choose wrongly?</button>'; $('#why').onclick = function () { discover('ver'); }; } }
      st.innerHTML = bytey('Be a data detective! 🕵️ Flag every review that looks <b>fake</b>.', 'Clues: account made today, many posts at the same minute, copy-pasted text, no verified purchase.') +
        '<div class="stats"><span>Rating of the reviews you keep: <b id="av" class="avg">' + avgOf(R) + '</b> ★</span><span>Fakes found: <b id="ff">0</b> / ' + fakes + '</span></div><div class="reviews">' + R.map(function (r, i) { return '<button class="rev" data-i="' + i + '"><span>' + r[0] + '</span> <b>' + r[1] + '</b><small>' + r[2] + ' · ' + r[3] + ' · ' + r[4] + '</small></button>'; }).join('') + '</div><div id="nxt"></div>';
      [].forEach.call(st.querySelectorAll('.rev'), function (b) {
        b.onclick = function () {
          var i = +b.dataset.i; if (flagged[i]) return;
          if (!R[i][5]) { b.classList.add('no'); st.classList.add('shake'); setTimeout(function () { st.classList.remove('shake'); b.classList.remove('no'); }, 450); return; }
          flagged[i] = 1; b.classList.add('gone'); $('#ff').textContent = Object.keys(flagged).length; upd();
        };
      });
    }
  }

  /* ================= final test ================= */
  function finalTest() {
    clearAll(); var Q = shuffle(TEST).slice(0, 6), i = 0, ok = 0, stats = { vol: [0, 0], vor: [0, 0], vel: [0, 0], ver: [0, 0] };
    function ask() {
      if (i >= Q.length) return end(); var q = Q[i];
      st.innerHTML = bytey('Final test ' + (i + 1) + ' / ' + Q.length + ': which V is this?') + '<div class="panel" style="background:#fff;color:#0f172a;font-weight:800;font-size:18px;line-height:1.5">' + esc(q[1]) + '</div><div class="q" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">' + Object.keys(V).map(function (k) { return '<button class="opt ' + V[k].c + '" data-k="' + k + '">' + V[k].e + ' ' + V[k].n + '</button>'; }).join('') + '</div><div id="fb"></div>';
      [].forEach.call(st.querySelectorAll('.opt'), function (b) {
        b.onclick = function () {
          var right = b.dataset.k === q[0]; stats[q[0]][1]++; if (right) { ok++; stats[q[0]][0]++; }
          [].forEach.call(st.querySelectorAll('.opt'), function (x) { x.disabled = true; if (x.dataset.k === q[0]) x.classList.add('good'); }); if (!right) b.classList.add('no');
          $('#fb').innerHTML = '<div class="msg" style="' + (right ? 'background:rgba(16,185,129,.18);border-color:#34d399' : '') + '">' + (right ? '✅ Correct! ' : '❌ It is ' + V[q[0]].n + '. ') + V[q[0]].n + ' = ' + esc(V[q[0]].d) + '</div><button class="btn" id="nx">' + (i + 1 < Q.length ? 'Next ▶' : 'Finish 🏁') + '</button>'; $('#nx').onclick = function () { i++; ask(); };
        };
      });
    }
    function end() {
      var pass = ok >= 4; if (pass && window.ICTGameDone) try { window.ICTGameDone(); } catch (e) {}
      st.innerHTML = '<div style="text-align:center"><div style="font-size:54px">' + (pass ? '🏆' : '🤔') + '</div><h2>' + (pass ? 'Data Lab complete!' : 'Almost there!') + '</h2><p class="sub">' + ok + ' of ' + Q.length + ' correct</p>' +
        (pass ? '<p style="font-weight:800;color:#6ee7b7">🎮 Game complete! +10 XP added to Book E on your world map.</p>' : '<p class="sub">Get at least 4 right to finish the game. Review your notebook and try again.</p>') +
        '<div class="note" style="text-align:left"><b>Remember:</b> big data = very large, varied, fast and uncertain data that is hard to process with ordinary database systems: <b>Volume, Variety, Velocity, Veracity</b>. Big data is <b>NOT</b> more accurate by nature.</div>' +
        '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="again">🔄 Try the test again</button><button class="btn sec" id="mn">📓 Back to lab</button><a class="btn sec" style="text-decoration:none" href="mindmap.html">🧠 Ch.1 mind map</a><a class="btn sec" style="text-decoration:none" href="../../mctrainer.html">🎯 MC Trainer</a></div></div>';
      $('#again').onclick = finalTest; $('#mn').onclick = menu;
    }
    ask();
  }
  menu();
})();
