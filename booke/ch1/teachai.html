<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teach-a-Bot Academy</title>
<style>
:root{color-scheme:dark;--bg:#0b1226;--panel:#162044;--line:rgba(255,255,255,.18);--txt:#f8fafc;--mut:#cbd5e1;--vol:#60a5fa;--vor:#34d399;--vel:#fbbf24;--ver:#c084fc;--bad:#fb7185;--ok:#34d399}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);background:radial-gradient(900px 500px at 12% -10%,#1e3a8a 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#581c87 0,transparent 55%),var(--bg);min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 90px}
h1{margin:6px 0 2px;font-size:28px}h2{margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 14px;line-height:1.5}
.panel{position:relative;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:20px;padding:20px;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 8px 20px rgba(99,102,241,.4)}
.btn:hover:not(:disabled){filter:brightness(1.12)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:rgba(255,255,255,.14);box-shadow:none}.btn.red{background:linear-gradient(135deg,#ef4444,#f97316)}
.btn.sm{padding:8px 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Bytey */
.say{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.bot{font-size:46px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(3deg)}}
.bub{background:#fff;color:#0f172a;border-radius:6px 18px 18px 18px;padding:10px 14px;font-weight:700;line-height:1.45;max-width:640px}
.bub small{display:block;color:#475569;font-weight:600;margin-top:3px}
/* menu */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.tile{text-align:left;border-radius:18px;padding:16px;border:2px solid var(--line);background:rgba(0,0,0,.25);transition:.15s}
.tile:hover{transform:translateY(-3px);border-color:#a5b4fc}
.tile .e{font-size:34px}.tile b{display:block;font-size:17px;margin:4px 0 2px}.tile span{font-size:13px;color:var(--mut)}
.tile.done{border-color:var(--ok);background:rgba(16,185,129,.12)}
.tile .st{float:right;font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;background:rgba(255,255,255,.14)}
.tile.done .st{background:var(--ok);color:#052e1d}
.nb{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.nbc{border-radius:14px;padding:10px 12px;border:2px dashed var(--line);font-size:13.5px;color:var(--mut);min-height:84px}
.nbc.on{border-style:solid;color:var(--txt);background:rgba(0,0,0,.28)}
.nbc b{display:block;font-size:16px}
.c-vol{border-color:var(--vol)!important}.c-vol b{color:var(--vol)}
.c-vor{border-color:var(--vor)!important}.c-vor b{color:var(--vor)}
.c-vel{border-color:var(--vel)!important}.c-vel b{color:var(--vel)}
.c-ver{border-color:var(--ver)!important}.c-ver b{color:var(--ver)}
/* sheet */
.sheet{width:100%;border-collapse:collapse;background:#f8fafc;color:#0f172a;font-size:13px;border-radius:10px;overflow:hidden}
.sheet th{background:#16a34a;color:#fff;padding:6px 8px;text-align:left}.sheet td{padding:5px 8px;border-bottom:1px solid #e2e8f0}
.sheetbar{display:flex;justify-content:space-between;background:#166534;color:#fff;padding:6px 10px;font-size:13px;font-weight:700;border-radius:10px 10px 0 0}
.meter{height:14px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34d399,#fbbf24,#ef4444);transition:width .3s}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-weight:800}.stats span{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 12px}
.crash{position:absolute;inset:0;background:rgba(15,5,20,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;animation:glitch .5s;z-index:5}
.crash .big{font-size:60px}
@keyframes glitch{0%{transform:translateX(-8px)}20%{transform:translateX(8px)}40%{transform:translateX(-6px)}60%{transform:translateX(6px)}100%{transform:none}}
.shake{animation:glitch .4s}
/* import */
.items{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.item{border:2px solid var(--line);background:rgba(0,0,0,.3);border-radius:14px;padding:10px 14px;font-weight:700}
.item.sel{border-color:#fbbf24;background:rgba(251,191,36,.2);transform:scale(1.05)}.item.tried{opacity:.5;text-decoration:line-through}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.col{border-radius:12px;border:2px solid #86efac;background:#f0fdf4;color:#14532d;padding:12px;font-weight:800;text-align:center}
.col small{display:block;font-weight:600;color:#166534}
.msg{min-height:44px;margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(251,113,133,.15);border:1px solid rgba(251,113,133,.5);font-weight:700}
/* belt */
.belt{position:relative;height:210px;border-radius:16px;background:repeating-linear-gradient(90deg,#1e293b 0 28px,#243049 28px 56px);border:2px solid #475569;overflow:hidden}
.pk{position:absolute;top:80px;width:54px;height:54px;border-radius:12px;background:#fff;color:#0f172a;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #6366f1;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.pk:hover{border-color:#fbbf24}
.pk.gone{opacity:0;transform:scale(1.6);transition:.3s}
.tool{position:absolute;right:0;top:0;bottom:0;width:64px;background:rgba(239,68,68,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;writing-mode:vertical-rl;letter-spacing:.1em}
/* readings */
.rd{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.rdc{border-radius:12px;padding:10px;background:rgba(0,0,0,.3);border:2px solid var(--line);font-weight:800;text-align:center}
.rdc.bad:hover{border-color:var(--bad)}.rdc.gone{opacity:.25;text-decoration:line-through}
.avg{font-size:30px;font-weight:900}
.q{margin:12px 0;display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.28);font-weight:700;line-height:1.4}
.opt:hover:not(:disabled){border-color:#a5b4fc;background:rgba(99,102,241,.2)}
.opt.good{border-color:var(--ok);background:rgba(16,185,129,.25)}.opt.no{border-color:var(--bad);background:rgba(244,63,94,.25)}
.stamp{margin:12px 0;padding:16px;border-radius:18px;border:3px solid;text-align:center;animation:stamp .5s}
.stamp .big{font-size:40px;font-weight:900}
@keyframes stamp{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
textarea{width:100%;min-height:64px;margin-top:6px;padding:10px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-size:14.5px}
.cards{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.num{min-width:54px;height:54px;border-radius:12px;border:3px solid #6366f1;background:#fff;color:#0f172a;font-weight:900;font-size:19px;padding:0 8px}
.num.sel{border-color:#fbbf24;background:#fef3c7;transform:translateY(-6px)}.more{color:var(--mut);font-weight:700}
.scene{background:#fff;color:#0f172a;border-radius:12px;padding:12px 14px;line-height:1.7;font-weight:600}
.map{display:flex;justify-content:space-around;background:#d1fae5;border-radius:10px;padding:14px;margin-bottom:6px;font-weight:800}.pin{background:#fecaca;border-radius:8px;padding:2px 8px}
.wave{font-size:26px;letter-spacing:2px;color:#6366f1}.frames{display:flex;gap:8px;margin-bottom:6px}.frames span{flex:1;background:#0f172a;color:#fff;border-radius:8px;padding:8px;text-align:center;font-size:13px}
.board{display:flex;gap:8px;flex-wrap:wrap;min-height:40px}.pinned{background:rgba(251,191,36,.2);border:2px solid #fbbf24;border-radius:10px;padding:6px 12px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.phone{border:3px solid var(--line);border-radius:18px;background:rgba(0,0,0,.28);padding:16px;text-align:center}
.phone:hover:not(:disabled){border-color:#a5b4fc}.phone.pick{border-color:#fbbf24}.phone small{color:var(--mut)}
.reviews{display:grid;gap:8px;margin:10px 0}.rev{text-align:left;border:2px solid var(--line);border-radius:14px;background:rgba(0,0,0,.28);padding:10px 12px;line-height:1.45}
.rev span{margin-right:6px}.rev small{display:block;color:var(--mut);font-weight:600}.rev:hover{border-color:#a5b4fc}.rev.gone{opacity:.3;text-decoration:line-through}.rev.no{border-color:var(--bad);background:rgba(244,63,94,.2)}
.mailroom{position:relative;height:190px;border-radius:16px;background:linear-gradient(180deg,#1e293b,#334155);border:2px solid #475569;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:10px 0}
.parcel{background:#fde68a;color:#451a03;border-radius:14px;padding:12px 22px;text-align:center;font-weight:700;line-height:1.5;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.bins3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dbin{border:3px solid;border-radius:14px;background:rgba(0,0,0,.3);padding:16px 6px;font-weight:900;font-size:17px}
.dbin:hover{filter:brightness(1.3);transform:translateY(-3px)}
.fall{position:absolute;font-size:34px;top:-50px;animation:drop 1.1s ease-in forwards}
@keyframes drop{to{top:calc(100% - 44px);transform:rotate(18deg)}}
.mailroom.buried .parcel{opacity:.25}
.hide{display:none!important}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.5);font-size:14.5px;line-height:1.55}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>
.c-sup{border-color:#60a5fa!important}.c-sup b{color:#60a5fa}
.c-uns{border-color:#34d399!important}.c-uns b{color:#34d399}
.c-bias{border-color:#fbbf24!important}.c-bias b{color:#fbbf24}
.c-ing{border-color:#c084fc!important}.c-ing b{color:#c084fc}
.photo{width:120px;height:120px;border-radius:18px;background:#fff;color:#0f172a;display:flex;align-items:center;justify-content:center;font-size:64px;margin:0 auto;border:4px solid #6366f1;box-shadow:0 8px 18px rgba(0,0,0,.45);position:relative}
.photo small{position:absolute;bottom:-4px;right:-4px;font-size:22px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.rl{border:2px solid var(--line);border-radius:12px;padding:10px;background:rgba(0,0,0,.28);font-weight:800;text-align:left}
.rl.on{border-color:#fbbf24;background:rgba(251,191,36,.2)}
.gridp{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:10px 0}
.gp{border-radius:14px;padding:8px;text-align:center;background:rgba(0,0,0,.3);border:2px solid var(--line);font-weight:700;font-size:12.5px;line-height:1.3}
.gp b{display:block;font-size:34px;font-weight:400}
.gp.ok{border-color:var(--ok)}.gp.bad{border-color:var(--bad);background:rgba(244,63,94,.18)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.chip{font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;background:rgba(255,255,255,.14)}
.chip.hot{background:#fbbf24;color:#422006}
.acc{display:flex;align-items:center;gap:10px;font-weight:800;margin:8px 0}.acc .meter{flex:1;margin:0}.acc .meter i{background:linear-gradient(90deg,#fb7185,#fbbf24,#34d399)}
.plot{width:100%;max-width:520px;display:block;margin:8px auto;background:rgba(0,0,0,.3);border-radius:16px;border:2px solid var(--line)}
.grpc{border:2px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:rgba(0,0,0,.25)}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.swb{border:3px solid var(--line);border-radius:18px;padding:14px;background:rgba(0,0,0,.28);text-align:center;font-weight:800}
.swb .e{font-size:38px;display:block}.swb small{display:block;color:var(--mut);font-weight:600}
.swb.on{border-color:#34d399;background:rgba(16,185,129,.2)}
.swb .t{display:inline-block;margin-top:6px;border-radius:99px;padding:2px 12px;background:#475569;font-size:12px}.swb.on .t{background:#34d399;color:#052e1d}
.hide{display:none!important}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:10px 0}
.sc{border-radius:14px;padding:8px;text-align:center;background:rgba(0,0,0,.3);border:2px solid var(--line);font-size:12.5px;font-weight:700;color:var(--txt)}
.sc .ph{font-size:34px;display:block;line-height:1.2}
.sc.pick{border-color:#fbbf24;background:rgba(251,191,36,.22)}.sc.sn .ph{background:linear-gradient(#dbeafe,#fff);border-radius:10px;color:#0f172a}.sc.gr .ph{background:linear-gradient(#bbf7d0,#86efac);border-radius:10px}
.sc.tag{cursor:default}
.net{width:100%;max-width:460px;display:block;margin:8px auto}
@keyframes pl{0%,100%{opacity:.15}50%{opacity:1}}
.pulse{animation:pl 1s infinite}
</style>
</head>
<body>
<div class="wrap">
  <h1>🤖 Teach-a-Bot Academy</h1>
  <p class="sub">Book E · Ch.1 Technological Innovations · 1.1 AI and data science</p>
  <div class="panel" id="stage"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var C = {
    sup: { n: 'Supervised learning', c: 'c-sup', hex: '#60a5fa', e: '🏷️', d: 'the machine learns from LABELLED data (examples that come with the right answer). The data is more explicit, so training time is shorter.' },
    uns: { n: 'Unsupervised learning', c: 'c-uns', hex: '#34d399', e: '🧩', d: 'the machine learns from UNLABELLED data and finds patterns or groups by itself. The data is less explicit, so training takes longer.' },
    bias: { n: 'Biased training data', c: 'c-bias', hex: '#fbbf24', e: '⚖️', d: 'an AI copies the patterns in its training data, so biased or one-sided data gives wrong or unfair results.' },
    ing: { n: 'What AI needs', c: 'c-ing', hex: '#c084fc', e: '🧠', d: 'AI is supported by big data (the examples), cloud computing (the computing power) and machine learning (the method). Deep learning uses artificial neural networks inspired by the brain (e.g. AlphaGo).' }
  };
  var EXP = [
    { k: 'sup', e: '🐱', t: 'Teach Muffin-bot', s: 'Can you program a bot to spot cats? Then try teaching it.' },
    { k: 'uns', e: '🍎', t: 'The alien market', s: 'A bot gets a pile of items with no labels.' },
    { k: 'bias', e: '🐺', t: 'The playground alarm', s: 'A bot guards the playground. Who taught it?' },
    { k: 'ing', e: '🏯', t: 'Build AlphaBot', s: 'Switch on ingredients and train a Go champion.' }
  ];
  var TEST = [
    ['sup', 'A program learns to spot spam by studying 10,000 emails that were each marked “spam” or “not spam”.'],
    ['sup', 'A bot learns to read handwriting from photos that are each tagged with the correct digit.'],
    ['uns', 'A shop gives an AI purchase records with no categories. It finds groups of similar customers by itself.'],
    ['uns', 'A program sorts thousands of news articles into groups of similar topics without being told any topic names.'],
    ['bias', 'A face-unlock system trained mostly on one skin tone often fails for other people.'],
    ['bias', 'A hiring AI trained only on past hires from one gender ranks other applicants lower.'],
    ['ing', 'Training a huge model needs thousands of powerful processors rented by the hour. Which support does AI need here?'],
    ['ing', 'A company collects big data and runs a machine learning method on cloud computing to build its AI.']
  ];
  var found = {}, notes = {}, st = $('#stage');
  try { var sv = JSON.parse(localStorage.getItem('ictTeachAI') || '{}'); found = sv.found || {}; notes = sv.notes || {}; } catch (e) {}
  var save = function () { try { localStorage.setItem('ictTeachAI', JSON.stringify({ found: found, notes: notes })); } catch (e) {} };
  var timers = []; function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearAll() { timers.forEach(function (t) { clearTimeout(t); clearInterval(t); }); timers = []; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function bot(msg, small) { return '<div class="say"><div class="bot">🤖</div><div class="bub">' + msg + (small ? '<small>' + small + '</small>' : '') + '</div></div>'; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function shake() { st.classList.add('shake'); setTimeout(function () { st.classList.remove('shake'); }, 400); }
  function count() { return Object.keys(found).length; }

  function menu() {
    clearAll(); var n = count();
    st.innerHTML = bot(n ? (n === 4 ? 'You taught me everything! Ready for the final test?' : 'Nice teaching! ' + (4 - n) + ' lesson' + (4 - n > 1 ? 's' : '') + ' left.') : "Hi! I'm <b>Muffin-bot</b>. I am an AI... but right now I know <b>absolutely nothing</b>. 😅 Please teach me!", n ? '' : 'Finish four lessons, then take the final test.') +
      '<div class="tiles">' + EXP.map(function (x, i) { var d = found[x.k]; return '<button class="tile ' + (d ? 'done' : '') + '" data-exp="' + i + '"><span class="st">' + (d ? '✔ done' : 'Lesson ' + (i + 1)) + '</span><div class="e">' + x.e + '</div><b>' + x.t + '</b><span>' + x.s + '</span></button>'; }).join('') + '</div>' +
      '<h3 style="margin:16px 0 8px">📓 My AI notebook</h3><div class="nb">' + Object.keys(C).map(function (k) { var v = C[k], on = found[k]; return '<div class="nbc ' + (on ? 'on ' + v.c : '') + '">' + (on ? '<b>' + v.e + ' ' + v.n + '</b>' + esc(v.n) + ': ' + esc(v.d) + (notes[k] ? '<br><i style="color:#fde68a">✍️ ' + esc(notes[k]) + '</i>' : '') : '<b>❓ ???</b>Finish a lesson to unlock.') + '</div>'; }).join('') + '</div>' +
      '<div class="row" style="margin-top:16px"><button class="btn red" id="final" ' + (n < 4 ? 'disabled' : '') + '>' + (n < 4 ? '🔒 Final test (finish all 4 lessons)' : '🏆 Final test') + '</button></div>';
    $('#final').onclick = finalTest;
    [].forEach.call(st.querySelectorAll('[data-exp]'), function (b) { b.onclick = function () { [l1, l2, l3, l4][+b.dataset.exp](); }; });
  }

  var DISC = {
    sup: { q: 'Why did Muffin-bot get better after training than with the rules you wrote?', o: { sup: 'It found the rules itself from many photos that were labelled with the right answer', uns: 'It was never given any labels and worked everything out alone', bias: 'It copied a biased set of photos', ing: 'It was given a longer list of IF rules by the programmer' } },
    uns: { q: 'Why did the AI call the groups “Group 1, 2, 3” instead of apples, lemons and grapes?', o: { sup: 'It was taught with labelled photos of apples, lemons and grapes', uns: 'The data had no labels, so it could find similar groups but did not know their names', bias: 'The fruit photos were unfair to lemons', ing: 'It did not have enough cloud computing' } },
    bias: { q: 'Why did the bot shout “WOLF!” at a dog playing in the snow?', o: { sup: 'It was given no labels at all', uns: 'It grouped the photos itself without help', bias: 'Its training photos were one-sided (every wolf was in snow), so it learned “snow = wolf”', ing: 'It needed more cloud computing power' } },
    ing: { q: 'Why did AlphaBot only become a champion when all three switches were on?', o: { sup: 'It only needs labelled data; the other two switches do nothing', uns: 'It only needs the machine learning method; data and power are optional', bias: 'Big data and cloud computing are enough without any learning method', ing: 'AI needs big data (examples), cloud computing (power) and machine learning (the method) together' } }
  };
  function discover(k) {
    clearAll(); var D = DISC[k], opts = shuffle(Object.keys(D.o));
    st.innerHTML = bot('Think about what just happened. 🤔', D.q) + '<div class="q">' + opts.map(function (o) { return '<button class="opt" data-o="' + o + '">' + D.o[o] + '</button>'; }).join('') + '</div><div id="rev"></div>';
    [].forEach.call(st.querySelectorAll('.opt'), function (b) {
      b.onclick = function () {
        if (b.dataset.o !== k) { b.classList.add('no'); shake(); $('#rev').innerHTML = '<p class="sub">Not quite. Remember what you saw in the lesson and try again.</p>'; return; }
        [].forEach.call(st.querySelectorAll('.opt'), function (x) { x.disabled = true; }); b.classList.add('good'); found[k] = 1; save(); var v = C[k];
        $('#rev').innerHTML = '<div class="stamp ' + v.c + '" style="background:rgba(0,0,0,.3)"><div style="font-size:15px;color:var(--mut)">You learned…</div><div class="big" style="color:' + v.hex + ';font-size:30px">' + v.e + ' ' + v.n.toUpperCase() + '</div><div style="font-size:16px;line-height:1.5;margin-top:4px">' + esc(v.n) + ': ' + esc(v.d) + '</div></div>' +

  /* ===== final test ===== */
  function finalTest() {
    clearAll(); var Q = shuffle(TEST).slice(0, 6), i = 0, ok = 0;
    function ask() {
      if (i >= Q.length) return end(); var q = Q[i];
      st.innerHTML = bot('Final test ' + (i + 1) + ' / ' + Q.length + ': which idea is this?') + '<div class="panel" style="background:#fff;color:#0f172a;font-weight:800;font-size:18px;line-height:1.5">' + esc(q[1]) + '</div><div class="q" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">' + Object.keys(C).map(function (k) { return '<button class="opt ' + C[k].c + '" data-k="' + k + '">' + C[k].e + ' ' + C[k].n + '</button>'; }).join('') + '</div><div id="fb"></div>';
      [].forEach.call(st.querySelectorAll('.opt'), function (b) {
        b.onclick = function () {
          var right = b.dataset.k === q[0]; if (right) ok++;
          [].forEach.call(st.querySelectorAll('.opt'), function (x) { x.disabled = true; if (x.dataset.k === q[0]) x.classList.add('good'); }); if (!right) b.classList.add('no');
          $('#fb').innerHTML = '<div class="msg" style="' + (right ? 'background:rgba(16,185,129,.18);border-color:#34d399' : '') + '">' + (right ? '✅ Correct! ' : '❌ It is ' + C[q[0]].n + '. ') + esc(C[q[0]].n) + ': ' + esc(C[q[0]].d) + '</div><button class="btn" id="nx">' + (i + 1 < Q.length ? 'Next ▶' : 'Finish 🏁') + '</button>'; $('#nx').onclick = function () { i++; ask(); };
        };
      });
    }
    function end() {
      var pass = ok >= 4; if (pass && window.ICTGameDone) try { window.ICTGameDone(); } catch (e) {}
      st.innerHTML = '<div style="text-align:center"><div style="font-size:54px">' + (pass ? '🏆' : '🤔') + '</div><h2>' + (pass ? 'Academy complete!' : 'Almost there!') + '</h2><p class="sub">' + ok + ' of ' + Q.length + ' correct</p>' +
        (pass ? '<p style="font-weight:800;color:#6ee7b7">🎮 Game complete! +10 XP added to Book E on your world map.</p>' : '<p class="sub">Get at least 4 right to finish the game. Review your notebook and try again.</p>') +
        '<div class="note" style="text-align:left"><b>Remember:</b> in machine learning the machine trains itself on sample data, finds patterns and builds a model. <b>Supervised</b> = labelled data. <b>Unsupervised</b> = unlabelled data, finds patterns itself. <b>Deep learning</b> = artificial neural networks (e.g. AlphaGo). AI is supported by <b>big data, cloud computing and machine learning</b>. Biased training data gives biased results.</div>' +
        '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="again">🔄 Try the test again</button><button class="btn sec" id="mn">📓 Back to academy</button><a class="btn sec" style="text-decoration:none" href="mindmap.html">🧠 Ch.1 mind map</a><a class="btn sec" style="text-decoration:none" href="../../mctrainer.html">🎯 MC Trainer</a></div></div>';
      $('#again').onclick = finalTest; $('#mn').onclick = menu;
    }
    ask();
  }
  menu();
})();
</script>
