<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secondary 1 OS Interactive Learning Simulator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      overflow: hidden;
      transition: background 0.5s ease;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.8);
    }

    /* THEME STYLES */
    .theme-indigo {
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
    }
    .theme-emerald {
      background: radial-gradient(circle at 50% 30%, #064e3b 0%, #022c22 60%, #020617 100%);
    }
    .theme-purple {
      background: radial-gradient(circle at 50% 30%, #4c1d95 0%, #2e1065 60%, #020617 100%);
    }
    .theme-cyberpunk {
      background: radial-gradient(circle at 50% 30%, #831843 0%, #4c0519 50%, #020617 100%);
    }
    .theme-amber {
      background: radial-gradient(circle at 50% 30%, #78350f 0%, #451a03 60%, #020617 100%);
    }

    /* Glassmorphism Window Effect */
    .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.3s ease;
    }

    /* Toast notification slide animation */
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .animate-toast {
      animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Computer Tower Glow */
    @keyframes towerGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
      50% { box-shadow: 0 0 25px rgba(168, 85, 247, 0.7); }
    }
    .tower-rgb-glow {
      animation: towerGlow 3s infinite ease-in-out;
    }
  </style>
</head>
<body id="app-body" class="h-screen w-screen theme-indigo text-slate-100 flex flex-col justify-between relative overflow-hidden select-none">

  <!-- MAIN DESKTOP WORKSPACE -->
  <main id="desktop-area" class="flex-1 p-6 relative grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-6 content-start z-10">

    <!-- DESKTOP FOLDER 1: FUNCTIONS OF OS -->
    <div onclick="openFolder(1)" class="group flex flex-col items-center justify-center p-3 rounded-2xl hover:bg-white/10 cursor-pointer transition-all duration-200 border border-transparent hover:border-white/10 w-28">
      <div class="w-14 h-14 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform">
        <i class="fa-solid fa-gears text-2xl text-slate-950"></i>
      </div>
      <span class="text-xs font-semibold text-white mt-2 text-center drop-shadow">1. Functions of OS</span>
      <span class="text-[10px] text-amber-300/80 text-center font-mono">Resource Mgr</span>
    </div>

    <!-- DESKTOP FOLDER 2: USER OF OS -->
    <div onclick="openFolder(2)" class="group flex flex-col items-center justify-center p-3 rounded-2xl hover:bg-white/10 cursor-pointer transition-all duration-200 border border-transparent hover:border-white/10 w-28">
      <div class="w-14 h-14 bg-gradient-to-br from-sky-400 to-sky-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform">
        <i class="fa-solid fa-users text-2xl text-slate-950"></i>
      </div>
      <span class="text-xs font-semibold text-white mt-2 text-center drop-shadow">2. User of OS</span>
      <span class="text-[10px] text-sky-300/80 text-center font-mono">Single/Multi User</span>
    </div>

    <!-- DESKTOP FOLDER 3: PURPOSE OF OS -->
    <div onclick="openFolder(3)" class="group flex flex-col items-center justify-center p-3 rounded-2xl hover:bg-white/10 cursor-pointer transition-all duration-200 border border-transparent hover:border-white/10 w-28">
      <div class="w-14 h-14 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform">
        <i class="fa-solid fa-server text-2xl text-slate-950"></i>
      </div>
      <span class="text-xs font-semibold text-white mt-2 text-center drop-shadow">3. Purpose of OS</span>
      <span class="text-[10px] text-emerald-300/80 text-center font-mono">Desktop PC & NOS</span>
    </div>

    <!-- DESKTOP FOLDER 4: USER INTERFACE -->
    <div onclick="openFolder(4)" class="group flex flex-col items-center justify-center p-3 rounded-2xl hover:bg-white/10 cursor-pointer transition-all duration-200 border border-transparent hover:border-white/10 w-28">
      <div class="w-14 h-14 bg-gradient-to-br from-purple-400 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform">
        <i class="fa-solid fa-terminal text-2xl text-slate-950"></i>
      </div>
      <span class="text-xs font-semibold text-white mt-2 text-center drop-shadow">4. User Interface</span>
      <span class="text-[10px] text-purple-300/80 text-center font-mono">GUI vs CLI</span>
    </div>

  </main>

  <!-- MAIN SIMULATION WINDOW CONTAINER -->
  <div id="os-window" class="hidden absolute top-6 left-6 right-6 bottom-16 glass-panel rounded-2xl shadow-2xl flex flex-col z-30 border border-white/20 overflow-hidden">
    
    <!-- Window Title Bar -->
    <div class="bg-slate-900/90 border-b border-white/10 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i id="window-icon" class="fa-solid fa-folder text-amber-400 text-lg"></i>
        <h2 id="window-title" class="font-bold text-sm text-slate-100">1. Functions of OS</h2>
      </div>

      <!-- Window Control Buttons -->
      <div class="flex items-center space-x-2">
        <button onclick="minimizeWindow()" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition-colors">
          <i class="fa-solid fa-minus text-xs"></i>
        </button>
        <button onclick="closeWindow()" class="w-7 h-7 rounded-lg bg-red-600/80 hover:bg-red-600 flex items-center justify-center text-white transition-colors">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Window Navigation Tabs Bar -->
    <div class="bg-slate-950/80 px-4 py-2 border-b border-white/10 flex items-center space-x-2 overflow-x-auto text-xs font-medium">
      <button onclick="switchFolderTab(1)" id="folder-tab-1" class="px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-amber-500/20 text-amber-300 border border-amber-500/40">
        <i class="fa-solid fa-gears"></i>
        <span>1. Functions of OS</span>
      </button>
      <button onclick="switchFolderTab(2)" id="folder-tab-2" class="px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-slate-800 text-slate-400 hover:bg-slate-700">
        <i class="fa-solid fa-users"></i>
        <span>2. User of OS</span>
      </button>
      <button onclick="switchFolderTab(3)" id="folder-tab-3" class="px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-slate-800 text-slate-400 hover:bg-slate-700">
        <i class="fa-solid fa-server"></i>
        <span>3. Purpose of OS</span>
      </button>
      <button onclick="switchFolderTab(4)" id="folder-tab-4" class="px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-slate-800 text-slate-400 hover:bg-slate-700">
        <i class="fa-solid fa-terminal"></i>
        <span>4. User Interface</span>
      </button>
    </div>

    <!-- Window Dynamic Content Body -->
    <div id="window-body" class="flex-1 p-5 overflow-y-auto bg-slate-900/60">
      <!-- Content injected dynamically by JS -->
    </div>
  </div>

  <!-- WINDOWS 11 STYLE SYSTEM TASKBAR -->
  <footer class="h-12 glass-panel border-t border-white/10 flex items-center justify-between px-4 z-40 relative">
    
    <!-- Start Button -->
    <div class="flex items-center space-x-3">
      <button onclick="toggleStartMenu()" class="p-2 rounded-xl bg-indigo-600/80 hover:bg-indigo-500 text-white flex items-center space-x-2 shadow-lg transition-all hover:scale-105">
        <i class="fa-brands fa-windows text-base"></i>
        <span class="text-xs font-bold">Start</span>
      </button>

      <!-- Active Window Indicator -->
      <div id="taskbar-active-app" class="hidden flex items-center space-x-2 px-3 py-1 bg-slate-800/80 border border-white/10 rounded-xl text-xs text-slate-200">
        <i class="fa-solid fa-window-maximize text-amber-400"></i>
        <span id="taskbar-app-name" class="font-medium">Functions of OS</span>
      </div>
    </div>

    <!-- System Tray Clock & Sound Indicator -->
    <div class="flex items-center space-x-4 text-xs font-mono text-slate-300">
      <div class="flex items-center space-x-2 bg-slate-800/60 px-2.5 py-1 rounded-xl border border-white/10">
        <i class="fa-solid fa-volume-high text-emerald-400"></i>
        <i class="fa-solid fa-wifi text-sky-400"></i>
      </div>
      <div class="text-right">
        <div id="sys-clock" class="font-bold text-slate-100">12:00 PM</div>
        <div id="sys-date" class="text-[10px] text-slate-400">10/04/2026</div>
      </div>
    </div>
  </footer>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    /* GLOBAL STATE MANAGEMENT */
    let currentActiveFolder = 1;
    let activeLab = null;
    let currentThemeName = 'indigo';

    /* AUDIO SYNTHESIZER (WEB AUDIO API) */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAudio(type) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'eject') {
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          osc.frequency.setValueAtTime(250, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'format') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }
      } catch (e) { console.log('Audio disabled', e); }
    }

    /* TOAST NOTIFICATION GENERATOR */
    function showToast(title, message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      let iconColor = 'text-sky-400';
      let borderColor = 'border-sky-500/40';

      if (type === 'success') { iconColor = 'text-emerald-400'; borderColor = 'border-emerald-500/40'; }
      if (type === 'error') { iconColor = 'text-red-400'; borderColor = 'border-red-500/40'; }

      toast.className = `pointer-events-auto bg-slate-900/95 border ${borderColor} text-white px-4 py-3 rounded-2xl shadow-2xl flex items-start space-x-3 min-w-[280px] max-w-sm animate-toast backdrop-blur-md z-50`;
      toast.innerHTML = `
        <i class="fa-solid fa-circle-info ${iconColor} text-lg mt-0.5"></i>
        <div class="flex-1">
          <div class="font-bold text-xs text-slate-100">${title}</div>
          <div class="text-[11px] text-slate-300 leading-snug mt-0.5">${message}</div>
        </div>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    /* SYSTEM CLOCK UPDATER */
    function updateSystemClock() {
      const clock = document.getElementById('sys-clock');
      const dateEl = document.getElementById('sys-date');
      const now = new Date();
      if (clock) clock.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (dateEl) dateEl.innerText = now.toLocaleDateString();
    }
    setInterval(updateSystemClock, 1000);
    updateSystemClock();

    /* WINDOW VISIBILITY CONTROLLERS */
    function openFolder(folderId) {
      playAudio('click');
      currentActiveFolder = folderId;
      activeLab = null;

      const win = document.getElementById('os-window');
      const activeApp = document.getElementById('taskbar-active-app');
      if (win) win.classList.remove('hidden');
      if (activeApp) activeApp.classList.remove('hidden');

      updateFolderTabHighlight(folderId);
      renderFolderContent(folderId);
    }

    function switchFolderTab(folderId) {
      playAudio('click');
      currentActiveFolder = folderId;
      activeLab = null;
      updateFolderTabHighlight(folderId);
      renderFolderContent(folderId);
    }

    function updateFolderTabHighlight(folderId) {
      for (let i = 1; i <= 4; i++) {
        const tab = document.getElementById(`folder-tab-${i}`);
        if (!tab) continue;
        if (i === folderId) {
          tab.className = 'px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold';
        } else {
          tab.className = 'px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-slate-800 text-slate-400 hover:bg-slate-700 font-medium';
        }
      }

      const titleEl = document.getElementById('window-title');
      const appNameEl = document.getElementById('taskbar-app-name');
      const titles = {
        1: '1. Functions of OS (Resource Management)',
        2: '2. User of OS (Single vs Multi-User Virtualization)',
        3: '3. Purpose of OS (Desktop PC Virtualization & NOS)',
        4: '4. User Interface (GUI vs CLI Virtual Shells)'
      };
      if (titleEl) titleEl.innerText = titles[folderId];
      if (appNameEl) appNameEl.innerText = titles[folderId];
    }

    function closeWindow() {
      playAudio('click');
      const win = document.getElementById('os-window');
      const activeApp = document.getElementById('taskbar-active-app');
      if (win) win.classList.add('hidden');
      if (activeApp) activeApp.classList.add('hidden');
    }

    function minimizeWindow() {
      closeWindow();
    }

    function toggleStartMenu() {
      showToast('Windows Start Menu', 'Click any desktop icon or folder to launch interactive OS learning labs!', 'info');
    }

    /* RENDER FOLDER CONTENT BASED ON SELECTION */
    function renderFolderContent(folderId) {
      const body = document.getElementById('window-body');
      if (!body) return;

      if (folderId === 1) {
        body.innerHTML = getFunctionsFolderHTML();
      } else if (folderId === 2) {
        body.innerHTML = getUserTypesFolderHTML();
      } else if (folderId === 3) {
        body.innerHTML = getPurposeFolderHTML();
        initDesktopPCVirtualization();
      } else if (folderId === 4) {
        body.innerHTML = getUIFolderHTML();
        initCLITerminal();
        renderGUIFolderCanvas();
      }
    }

    function getFunctionsFolderHTML() {
      return `
        <div class="mb-4 bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl flex items-center space-x-3">
          <i class="fa-solid fa-graduation-cap text-2xl text-amber-400"></i>
          <div>
            <h3 class="font-bold text-sm text-amber-200">OS Core Functions Interactive Labs</h3>
            <p class="text-[11px] text-slate-300">Click any lab below to directly test real operating system functions!</p>
          </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <button onclick="launchLab('process')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-microchip text-2xl text-amber-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">1. Process Mgr</span>
            <span class="text-[10px] text-slate-400 mt-0.5">CPU Queue & Scheduling</span>
          </button>
          <button onclick="launchLab('memory')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-memory text-2xl text-sky-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">2. Memory Mgr</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Dynamic RAM Allocation</span>
          </button>
          <button onclick="launchLab('pnp')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-plug text-2xl text-emerald-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">3. Plug-and-Play</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Connect & Unplug Hardware</span>
          </button>
          <button onclick="launchLab('file-explorer')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-folder-tree text-2xl text-purple-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">4. File System</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Folders, Files & Editor</span>
          </button>
          <button onclick="launchLab('disk')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-hard-drive text-2xl text-pink-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">5. Disk Mgr</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Partitioning & Formatting</span>
          </button>
          <button onclick="launchLab('ui-customizer')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-palette text-2xl text-yellow-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">6. UI Customizer</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Themes & Desktop Styling</span>
          </button>
          <button onclick="launchLab('user-mgr')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-user-shield text-2xl text-indigo-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">7. Admin User Mgr</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Add & Delete Accounts</span>
          </button>
          <button onclick="launchLab('multitasking')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-window-restore text-2xl text-teal-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">8. Multitasking</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Run Live Mini-Apps</span>
          </button>
        </div>
        <div id="active-lab-container" class="mt-4">
          <!-- Lab interactive panel rendered here -->
        </div>
      `;
    }

    function launchLab(labId) {
      playAudio('click');
      activeLab = labId;
      const container = document.getElementById('active-lab-container');
      if (!container) return;

      if (labId === 'process') {
        container.innerHTML = getProcessLabHTML();
      } else if (labId === 'memory') {
        container.innerHTML = getMemoryLabHTML();
        renderRAMBlocks();
      } else if (labId === 'pnp') {
        container.innerHTML = getPnPLabHTML();
      } else if (labId === 'file-explorer') {
        container.innerHTML = getFileExplorerHTML();
        renderFileExplorer();
      } else if (labId === 'disk') {
        container.innerHTML = getDiskLabHTML();
      } else if (labId === 'ui-customizer') {
        container.innerHTML = getUICustomizerHTML();
      } else if (labId === 'user-mgr') {
        container.innerHTML = getUserManagerHTML();
        renderUserList();
      } else if (labId === 'multitasking') {
        container.innerHTML = getMultitaskingLabHTML();
      }
    }

    /* PROCESS LAB */
    let runningProcesses = [
      { id: 101, name: 'Browser.exe', status: 'Running', cpu: '15%' },
      { id: 102, name: 'WordProcessor.exe', status: 'Running', cpu: '8%' }
    ];

    function getProcessLabHTML() {
      return `
        <div class="bg-slate-950 p-4 rounded-xl border border-amber-500/30 space-y-3">
          <div class="flex justify-between items-center border-b border-white/10 pb-2">
            <span class="font-bold text-amber-300 text-xs flex items-center space-x-2">
              <i class="fa-solid fa-microchip text-amber-400"></i>
              <span>Process Management Scheduler</span>
            </span>
            <button onclick="addSampleProcess()" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs rounded-lg shadow">+ Launch New Process</button>
          </div>
          <div id="process-list" class="space-y-2">
            ${runningProcesses.map(p => `
              <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg border border-white/10">
                <div class="flex items-center space-x-3">
                  <span class="font-mono text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded">PID: ${p.id}</span>
                  <span class="font-bold text-xs text-white">${p.name}</span>

        return;

      playAudio('success');
      for (let i = 0; i < sizeMB; i++) {

      renderRAMBlocks();
      showToast('RAM Allocated', `Allocated ${sizeMB} MB RAM for ${name}`, 'success');

    function submitCreateItem() {
      const input = document.getElementById('create-item-input');
      if (!input || !input.value.trim()) return;

      const name = input.value.trim();
      const newItem = creatingItemType === 'folder'
        ? { id: 'f_' + Date.now(), name: name, type: 'folder', items: [] }
        : { id: 'file_' + Date.now(), name: name.endsWith('.txt') ? name : name + '.txt', type: 'file', content: 'Sample text content inside ' + name };

      if (currentFolderId) {
        const parentFolder = fileTree.find(f => f.id === currentFolderId);
        if (parentFolder) parentFolder.items.push(newItem);
      } else {
        fileTree.push(newItem);

      hideCreateItemModal();
      playAudio('success');
      renderFileExplorer();
      showToast('Item Created', `Successfully created ${creatingItemType} "${name}"!`, 'success');

    function getCurrentFolderItems() {

      const input = document.getElementById('new-username-input');
      const select = document.getElementById('new-user-role-select');

      const name = input.value.trim();
      const role = select ? select.value : 'Standard User';
      osUsers.push({ id: 'u_' + Date.now(), name, role });
      input.value = '';
      playAudio('success');
      renderUserList();
      showToast('User Created', `Administrator added new user "${name}".`, 'success');

      initDesktopPCVirtualization();
      renderFolderContent(3);
      showToast('Monitor Refresh Rate', `PC Monitor set to ${pcRefreshRate} Hz.`, 'info');
    }

    function rebootVirtualPC() {
      playAudio('eject');
      showToast('Rebooting Virtual PC', 'Restarting Desktop Computer setup...', 'error');
      setTimeout(() => {
        playAudio('success');
        showToast('Virtual PC Online', 'Desktop OS booted successfully!', 'success');
      }, 1200);
    }

    function switchPurposeTab(tab) {
      playAudio('click');
      ['desktop', 'mobile', 'network'].forEach(t => {
        const btn = document.getElementById(`p-btn-${t}`);
        const view = document.getElementById(`p-view-${t}`);
        if (!btn || !view) return;
        if (t === tab) {
          btn.className = 'px-3.5 py-1.5 bg-emerald-600 text-white rounded-xl font-bold text-xs shadow';
          view.classList.remove('hidden');
        } else {
          btn.className = 'px-3.5 py-1.5 bg-slate-800 text-slate-400 hover:bg-slate-700 rounded-xl font-bold text-xs';
          view.classList.add('hidden');
        }
      });
    }

    function runNOSCommand(cmd) {
      playAudio('click');
      const out = document.getElementById('nos-cli-output');
      if (!out) return;
      if (cmd === 'ping') {
        out.innerText = "Pinging 192.168.1.1:\nReply from 192.168.1.1: bytes=32 time=2ms TTL=64";
      } else if (cmd === 'netstat') {
        out.innerText = "Active Connections:\nTCP    192.168.1.10:80        Client1:50122          ESTABLISHED";
      }
    }

    /* USER INTERFACE: CLI VS GUI SHELLS */
    let cliTerminalHistory = ["Windows Command Prompt [Version 10.0]", "Type 'help' for available commands.\n"];
    let guiFoldersList = [
      { id: 'g1', name: 'Documents', files: ['Essay.docx', 'Notes.txt'] },
      { id: 'g2', name: 'Pictures', files: ['Photo.png'] }
    ];
    let guiActiveFolderIndex = null;

    function getUIFolderHTML() {
      return `
        <div class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- CLI TERMINAL -->
            <div class="bg-slate-950 p-3 rounded-xl border border-purple-500/40 flex flex-col justify-between h-72 shadow">
              <div class="border-b border-white/10 pb-2 font-mono text-xs text-purple-400 font-bold">
                <i class="fa-solid fa-terminal mr-1"></i> CLI Terminal (Type Commands)
              </div>
              <div id="cli-terminal-screen" class="font-mono text-[11px] text-emerald-400 bg-black p-2.5 rounded-lg flex-1 my-2 overflow-auto whitespace-pre-wrap border border-white/10 leading-snug"></div>
              <div class="flex items-center space-x-1 bg-black px-2 py-1 rounded-lg border border-purple-500/50">
                <span class="font-mono text-xs text-purple-400 font-bold">C:\\></span>
                <input type="text" id="cli-terminal-input" placeholder="type 'help', 'dir', 'mkdir test'..." class="flex-1 bg-transparent font-mono text-xs text-emerald-400 focus:outline-none" onkeydown="handleCLIKenter(event)" />
                <button onclick="submitCLIInput()" class="px-2 py-0.5 bg-purple-700 hover:bg-purple-600 text-white font-mono text-[10px] rounded font-bold">Run</button>
              </div>
            </div>

            <!-- GUI VISUAL EXPLORER -->
            <div class="bg-slate-950 p-3 rounded-xl border border-sky-500/40 flex flex-col justify-between h-72 shadow">
              <div class="border-b border-white/10 pb-2 font-bold text-xs text-sky-400">
                <i class="fa-solid fa-desktop mr-1"></i> GUI Explorer (Click Icons)
              </div>
              <div class="flex items-center space-x-2 my-1">
                <button onclick="guiCreateFolder()" class="px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded text-[10px] font-bold">+ Click New Folder</button>
                <button onclick="guiCreateFile()" class="px-2.5 py-1 bg-sky-600 hover:bg-sky-500 text-white rounded text-[10px] font-bold">+ Click New File</button>
              </div>
              <div id="gui-interactive-canvas" class="bg-slate-900 p-2.5 rounded-lg flex-1 overflow-auto border border-white/10"></div>
            </div>
          </div>
        </div>
      `;
    }

    function initCLITerminal() {
      const screen = document.getElementById('cli-terminal-screen');
      if (screen) {
        screen.innerText = cliTerminalHistory.join('\n') + '\nC:\\> _';
        screen.scrollTop = screen.scrollHeight;
      }
    }

    function handleCLIKenter(e) {
      if (e.key === 'Enter') submitCLIInput();
    }

    function submitCLIInput() {
      const input = document.getElementById('cli-terminal-input');
      const screen = document.getElementById('cli-terminal-screen');
      if (!input || !screen || !input.value.trim()) return;

      const cmd = input.value.trim();
      input.value = '';
      playAudio('click');

      cliTerminalHistory.push(`C:\\> ${cmd}`);
      const parts = cmd.toLowerCase().split(' ');
      const main = parts[0];

      if (main === 'help') {
        cliTerminalHistory.push(`Commands:\n - dir/ls\n - mkdir <name>\n - cls\n - ver`);
      } else if (main === 'dir' || main === 'ls') {
        cliTerminalHistory.push(`Directory of C:\\\n<DIR> Documents\n<DIR> Pictures\nSystem_Logs.txt`);
      } else if (main === 'mkdir') {
        const folderName = parts.slice(1).join('_') || 'NewFolder';
        cliTerminalHistory.push(`Directory '${folderName}' created.`);
        showToast('CLI Command', `Created '${folderName}' via CLI!`, 'success');
      } else if (main === 'cls') {
        cliTerminalHistory = ["Windows Command Prompt [Version 10.0]"];
      } else if (main === 'ver') {
        cliTerminalHistory.push("Secondary 1 OS Learning Edition v2.0");
      } else {
        cliTerminalHistory.push(`'${cmd}' is not recognized. Type 'help'.`);
      }

      screen.innerText = cliTerminalHistory.join('\n') + '\nC:\\> _';
      screen.scrollTop = screen.scrollHeight;
    }

    function renderGUIFolderCanvas() {
      const canvas = document.getElementById('gui-interactive-canvas');
      if (!canvas) return;

      let html = '<div class="grid grid-cols-3 gap-2">';
      guiFoldersList.forEach((folder, idx) => {
        html += `
          <div onclick="guiClickOpenFolder(${idx})" class="p-2 bg-slate-800 hover:bg-slate-700 border border-amber-500/40 rounded-lg flex flex-col items-center justify-center cursor-pointer transition-all hover:scale-105">
            <i class="fa-solid fa-folder text-amber-400 text-2xl mb-1"></i>
            <span class="text-[10px] text-white font-bold truncate w-full text-center">${folder.name}</span>
          </div>
        `;
      });
      html += '</div>';

      if (guiActiveFolderIndex !== null) {
        const folder = guiFoldersList[guiActiveFolderIndex];
        html += `
          <div class="mt-3 p-2 bg-slate-950 border border-sky-500/40 rounded-lg">
            <div class="flex justify-between items-center text-[10px] font-bold text-sky-300 border-b border-white/10 pb-1 mb-2">
              <span>Opened: ${folder.name}</span>
              <button onclick="guiCloseFolder()" class="text-red-400 hover:underline">Close ✕</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
              ${folder.files.map(f => `
                <div class="p-1.5 bg-slate-800 border border-sky-400/30 rounded flex items-center space-x-1.5">
                  <i class="fa-solid fa-file-lines text-sky-400 text-xs"></i>
                  <span class="text-[9px] text-slate-200 truncate">${f}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      canvas.innerHTML = html;
    }

    function guiClickOpenFolder(index) {
      playAudio('click');
      guiActiveFolderIndex = index;
      renderGUIFolderCanvas();
    }

    function guiCloseFolder() {
      playAudio('click');
      guiActiveFolderIndex = null;
      renderGUIFolderCanvas();
    }

    function guiCreateFolder() {
      playAudio('success');
      const name = `Folder_${guiFoldersList.length + 1}`;
      guiFoldersList.push({ id: 'g_' + Date.now(), name: name, files: ['File1.txt'] });
      renderGUIFolderCanvas();
      showToast('GUI Folder Created', `Clicked button to create folder "${name}"!`, 'success');
    }

    function guiCreateFile() {
      playAudio('success');
      if (guiActiveFolderIndex !== null) {
        guiFoldersList[guiActiveFolderIndex].files.push(`Doc_${Date.now().toString().slice(-4)}.txt`);
      } else {
        guiFoldersList[0].files.push(`Doc_${Date.now().toString().slice(-4)}.txt`);
      }
      renderGUIFolderCanvas();
      showToast('GUI File Created', 'Added file into folder!', 'success');
    }

    window.openFolder = openFolder;
    window.switchFolderTab = switchFolderTab;
    window.closeWindow = closeWindow;
    window.minimizeWindow = minimizeWindow;
    window.toggleStartMenu = toggleStartMenu;
    window.launchLab = launchLab;
    window.addSampleProcess = addSampleProcess;
    window.terminateProcess = terminateProcess;
    window.allocateRAM = allocateRAM;
    window.clearRAM = clearRAM;
    window.plugPeripheral = plugPeripheral;
    window.unplugPeripheral = unplugPeripheral;
    window.showCreateItemModal = showCreateItemModal;
    window.hideCreateItemModal = hideCreateItemModal;
    window.submitCreateItem = submitCreateItem;
    window.navigateFolder = navigateFolder;
    window.openFileViewer = openFileViewer;
    window.closeFileViewer = closeFileViewer;
    window.saveActiveFileContent = saveActiveFileContent;
    window.deleteExplorerItem = deleteExplorerItem;
    window.updateDiskPartitions = updateDiskPartitions;
    window.formatDrive = formatDrive;
    window.setTheme = setTheme;
    window.toggleAdminRoleState = toggleAdminRoleState;
    window.adminAddUser = adminAddUser;
    window.adminDeleteUser = adminDeleteUser;
    window.switchUserTypeTab = switchUserTypeTab;
    window.attemptSingleUserLogin = attemptSingleUserLogin;
    window.runMultiUserTask = runMultiUserTask;
    window.switchPurposeTab = switchPurposeTab;
    window.switchDesktopVirtualApp = switchDesktopVirtualApp;
    window.toggleGpuTurbo = toggleGpuTurbo;
    window.cycleRefreshRate = cycleRefreshRate;
    window.rebootVirtualPC = rebootVirtualPC;
    window.runNOSCommand = runNOSCommand;
    window.handleCLIKenter = handleCLIKenter;
    window.submitCLIInput = submitCLIInput;
    window.guiClickOpenFolder = guiClickOpenFolder;
    window.guiCloseFolder = guiCloseFolder;
    window.guiCreateFolder = guiCreateFolder;
    window.guiCreateFile = guiCreateFile;

    /* INITIAL LAUNCH */
    window.onload = function() {
      openFolder(1);
    };
  </script>
</body>
</html>
