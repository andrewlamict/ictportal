<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secondary 1 OS Interactive Learning Simulator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.8);
    }

    /* ULTRA HIGH CONTRAST THEME STYLES */
    .theme-indigo {
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: #f8fafc;
    }
    .theme-cyber-contrast {
      background: radial-gradient(circle at 50% 30%, #ec4899 0%, #831843 45%, #0f172a 90%, #000000 100%);
      color: #ffffff;
    }
    .theme-daylight-contrast {
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #e2e8f0 50%, #cbd5e1 100%);
      color: #0f172a;
    }
    .theme-electric-cyan {
      background: radial-gradient(circle at 50% 30%, #06b6d4 0%, #0e7490 40%, #020617 100%);
      color: #ffffff;
    }
    .theme-vivid-amber {
      background: radial-gradient(circle at 50% 30%, #f59e0b 0%, #b45309 45%, #451a03 90%, #020617 100%);
      color: #ffffff;
    }

    /* Glassmorphism Window Effect with Theme Adaptation */
    .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .theme-daylight-contrast .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(15, 23, 42, 0.2);
      color: #0f172a;
    }

    /* Animations */
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .animate-toast {
      animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8)); }
    }
    .pulse-glow {
      animation: pulseGlow 2s infinite ease-in-out;
    }
  </style>
</head>
<body id="app-body" class="h-screen w-screen theme-cyber-contrast text-slate-100 flex flex-col justify-between relative overflow-hidden select-none">

  <!-- MAIN DESKTOP WORKSPACE -->
  <main id="desktop-area" class="flex-1 p-6 relative grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-6 content-start z-10">

    <!-- DESKTOP FOLDER 1: FUNCTIONS OF OS -->
    <div onclick="openFolder(1)" class="group flex flex-col items-center justify-center p-3 rounded-2xl hover:bg-white/20 cursor-pointer transition-all duration-200 border border-transparent hover:border-white/30 w-28 text-center">
      <div class="w-14 h-14 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl flex items-center justify-center shadow-2xl group-hover:scale-110 transition-transform">
        <i class="fa-solid fa-gears text-2xl text-slate-950"></i>
      </div>
      <span class="text-xs font-bold text-white mt-2 drop-shadow-md">1. Functions of OS</span>
      <span class="text-[10px] text-amber-300 font-mono font-bold bg-black/40 px-1.5 py-0.5 rounded mt-0.5">Resource Mgr</span>
    </div>

    <!-- DESKTOP FOLDER 2: SINGLE VS MULTI-USER OS -->
    <div onclick="openFolder(2)" class="group flex flex-col items-center justify-center p-3 rounded-2xl hover:bg-white/20 cursor-pointer transition-all duration-200 border border-transparent hover:border-white/30 w-28 text-center">
      <div class="w-14 h-14 bg-gradient-to-br from-sky-400 to-sky-600 rounded-2xl flex items-center justify-center shadow-2xl group-hover:scale-110 transition-transform">
        <i class="fa-solid fa-users-line text-2xl text-slate-950"></i>
      </div>
      <span class="text-xs font-bold text-white mt-2 drop-shadow-md">2. Single vs Multi-User</span>
      <span class="text-[10px] text-sky-300 font-mono font-bold bg-black/40 px-1.5 py-0.5 rounded mt-0.5">OS Users Lab</span>
    </div>

    <!-- DESKTOP FOLDER 3: PURPOSE OF OS -->
    <div onclick="openFolder(3)" class="group flex flex-col items-center justify-center p-3 rounded-2xl hover:bg-white/20 cursor-pointer transition-all duration-200 border border-transparent hover:border-white/30 w-28 text-center">
      <div class="w-14 h-14 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-2xl flex items-center justify-center shadow-2xl group-hover:scale-110 transition-transform">
        <i class="fa-solid fa-laptop-code text-2xl text-slate-950"></i>
      </div>
      <span class="text-xs font-bold text-white mt-2 drop-shadow-md">3. Purpose of OS</span>
      <span class="text-[10px] text-emerald-300 font-mono font-bold bg-black/40 px-1.5 py-0.5 rounded mt-0.5">Desktop & Mobile</span>
    </div>

    <!-- DESKTOP FOLDER 4: USER INTERFACE -->
    <div onclick="openFolder(4)" class="group flex flex-col items-center justify-center p-3 rounded-2xl hover:bg-white/20 cursor-pointer transition-all duration-200 border border-transparent hover:border-white/30 w-28 text-center">
      <div class="w-14 h-14 bg-gradient-to-br from-purple-400 to-purple-600 rounded-2xl flex items-center justify-center shadow-2xl group-hover:scale-110 transition-transform">
        <i class="fa-solid fa-display text-2xl text-slate-950"></i>
      </div>
      <span class="text-xs font-bold text-white mt-2 drop-shadow-md">4. User Interface</span>
      <span class="text-[10px] text-purple-300 font-mono font-bold bg-black/40 px-1.5 py-0.5 rounded mt-0.5">Interactive GUI</span>
    </div>

  </main>

  <!-- MAIN SIMULATION WINDOW CONTAINER -->
  <div id="os-window" class="hidden absolute top-4 left-4 right-4 bottom-16 glass-panel rounded-2xl shadow-2xl flex flex-col z-30 border border-white/20 overflow-hidden">
    
    <!-- Window Title Bar -->
    <div class="bg-slate-900/90 border-b border-white/10 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i id="window-icon" class="fa-solid fa-folder text-amber-400 text-lg"></i>
        <h2 id="window-title" class="font-bold text-sm text-slate-100">1. Functions of OS</h2>
      </div>

      <!-- Window Control Buttons -->
      <div class="flex items-center space-x-2">
        <button onclick="minimizeWindow()" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition-colors">
          <i class="fa-solid fa-minus text-xs"></i>
        </button>
        <button onclick="closeWindow()" class="w-7 h-7 rounded-lg bg-red-600 hover:bg-red-500 flex items-center justify-center text-white transition-colors">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Window Navigation Tabs Bar -->
    <div class="bg-slate-950/90 px-4 py-2 border-b border-white/10 flex items-center space-x-2 overflow-x-auto text-xs font-medium">
      <button onclick="switchFolderTab(1)" id="folder-tab-1" class="px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-amber-500/20 text-amber-300 border border-amber-500/40">
        <i class="fa-solid fa-gears"></i>
        <span>1. Functions of OS</span>
      </button>
      <button onclick="switchFolderTab(2)" id="folder-tab-2" class="px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-slate-800 text-slate-400 hover:bg-slate-700">
        <i class="fa-solid fa-users-line"></i>
        <span>2. Single vs Multi-User OS</span>
      </button>
      <button onclick="switchFolderTab(3)" id="folder-tab-3" class="px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-slate-800 text-slate-400 hover:bg-slate-700">
        <i class="fa-solid fa-laptop-code"></i>
        <span>3. Purpose of OS</span>
      </button>
      <button onclick="switchFolderTab(4)" id="folder-tab-4" class="px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-slate-800 text-slate-400 hover:bg-slate-700">
        <i class="fa-solid fa-display"></i>
        <span>4. User Interface</span>
      </button>
    </div>

    <!-- Window Dynamic Content Body -->
    <div id="window-body" class="flex-1 p-5 overflow-y-auto bg-slate-900/80">
      <!-- Content injected dynamically by JS -->
    </div>
  </div>

  <!-- SYSTEM TASKBAR -->
  <footer class="h-12 glass-panel border-t border-white/10 flex items-center justify-between px-4 z-40 relative">
    
    <!-- Start Button -->
    <div class="flex items-center space-x-3">
      <button onclick="toggleStartMenu()" class="p-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center space-x-2 shadow-lg transition-all hover:scale-105">
        <i class="fa-brands fa-windows text-base"></i>
        <span class="text-xs font-bold">Start</span>
      </button>

      <!-- Active Window Indicator -->
      <div id="taskbar-active-app" class="hidden flex items-center space-x-2 px-3 py-1 bg-slate-800/90 border border-white/20 rounded-xl text-xs text-slate-200">
        <i class="fa-solid fa-window-maximize text-amber-400"></i>
        <span id="taskbar-app-name" class="font-bold">Functions of OS</span>
      </div>
    </div>

    <!-- System Tray Clock & Sound Indicator -->
    <div class="flex items-center space-x-4 text-xs font-mono text-slate-300">
      <div class="flex items-center space-x-2 bg-slate-800/80 px-2.5 py-1 rounded-xl border border-white/10">
        <i class="fa-solid fa-volume-high text-emerald-400"></i>
        <i class="fa-solid fa-wifi text-sky-400"></i>
      </div>
      <div class="text-right">
        <div id="sys-clock" class="font-bold text-slate-100">12:00 PM</div>
        <div id="sys-date" class="text-[10px] text-slate-400">10/05/2026</div>
      </div>
    </div>
  </footer>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    /* GLOBAL STATE MANAGEMENT */
    let currentActiveFolder = 1;
    let activeLab = null;
    let currentThemeName = 'cyber-contrast';

    /* AUDIO SYNTHESIZER (WEB AUDIO API) */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAudio(type) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'eject') {
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          osc.frequency.setValueAtTime(250, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'format') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }
      } catch (e) { console.log('Audio error:', e); }
    }

    /* TOAST NOTIFICATION GENERATOR */
    function showToast(title, message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      let iconColor = 'text-sky-400';
      let borderColor = 'border-sky-500/50';

      if (type === 'success') { iconColor = 'text-emerald-400'; borderColor = 'border-emerald-500/50'; }
      if (type === 'error') { iconColor = 'text-red-400'; borderColor = 'border-red-500/50'; }

      toast.className = `pointer-events-auto bg-slate-900/95 border ${borderColor} text-white px-4 py-3 rounded-2xl shadow-2xl flex items-start space-x-3 min-w-[280px] max-w-sm animate-toast backdrop-blur-md z-50`;
      toast.innerHTML = `
        <i class="fa-solid fa-circle-info ${iconColor} text-lg mt-0.5"></i>
        <div class="flex-1">
          <div class="font-bold text-xs text-slate-100">${title}</div>
          <div class="text-[11px] text-slate-300 leading-snug mt-0.5">${message}</div>
        </div>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    /* SYSTEM CLOCK UPDATER */
    function updateSystemClock() {
      const clock = document.getElementById('sys-clock');
      const dateEl = document.getElementById('sys-date');
      const now = new Date();
      if (clock) clock.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (dateEl) dateEl.innerText = now.toLocaleDateString();
    }
    setInterval(updateSystemClock, 1000);
    updateSystemClock();

    /* WINDOW VISIBILITY CONTROLLERS */
    function openFolder(folderId) {
      playAudio('click');
      currentActiveFolder = folderId;
      activeLab = null;

      const win = document.getElementById('os-window');
      const activeApp = document.getElementById('taskbar-active-app');
      if (win) win.classList.remove('hidden');
      if (activeApp) activeApp.classList.remove('hidden');

      updateFolderTabHighlight(folderId);
      renderFolderContent(folderId);
    }

    function switchFolderTab(folderId) {
      playAudio('click');
      currentActiveFolder = folderId;
      activeLab = null;
      updateFolderTabHighlight(folderId);
      renderFolderContent(folderId);
    }

    function updateFolderTabHighlight(folderId) {
      for (let i = 1; i <= 4; i++) {
        const tab = document.getElementById(`folder-tab-${i}`);
        if (!tab) continue;
        if (i === folderId) {
          tab.className = 'px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold';
        } else {
          tab.className = 'px-3.5 py-1.5 rounded-xl transition-all flex items-center space-x-2 bg-slate-800 text-slate-400 hover:bg-slate-700 font-medium';
        }
      }

      const titleEl = document.getElementById('window-title');
      const appNameEl = document.getElementById('taskbar-app-name');
      const titles = {
        1: '1. Functions of OS (Resource Management)',
        2: '2. User of OS (Single-User OS vs Multi-User OS)',
        3: '3. Purpose of OS (Desktop PC OS vs Mobile OS vs NOS)',
        4: '4. User Interface (Interactive GUI WIMP vs CLI Shell)'
      };
      if (titleEl) titleEl.innerText = titles[folderId];
      if (appNameEl) appNameEl.innerText = titles[folderId];
    }

    function closeWindow() {
      playAudio('click');
      const win = document.getElementById('os-window');
      const activeApp = document.getElementById('taskbar-active-app');
      if (win) win.classList.add('hidden');
      if (activeApp) activeApp.classList.add('hidden');
    }

    function minimizeWindow() {
      closeWindow();
    }

    function toggleStartMenu() {
      showToast('Windows Start Menu', 'Click any desktop icon or folder to launch interactive OS learning labs!', 'info');
    }

    function renderFolderContent(folderId) {
      const body = document.getElementById('window-body');
      if (!body) return;

      if (folderId === 1) {
        body.innerHTML = getFunctionsFolderHTML();
      } else if (folderId === 2) {
        body.innerHTML = getUserTypesFolderHTML();
      } else if (folderId === 3) {
        body.innerHTML = getPurposeFolderHTML();
      } else if (folderId === 4) {
        body.innerHTML = getUIFolderHTML();
        initCLITerminal();
      }
    }

    /* =========================================================
       FOLDER 1: FUNCTIONS OF OS
       ========================================================= */
    function getFunctionsFolderHTML() {
      return `
        <div class="mb-4 bg-amber-500/10 border border-amber-500/30 p-3.5 rounded-xl flex items-center space-x-3">
          <i class="fa-solid fa-graduation-cap text-2xl text-amber-400"></i>
          <div>
            <h3 class="font-bold text-sm text-amber-200">OS Core Functions Interactive Labs</h3>
            <p class="text-[11px] text-slate-300">Click any lab below to directly test real operating system functions!</p>
          </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <button onclick="launchLab('process')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-microchip text-2xl text-amber-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">1. Process Mgr</span>
            <span class="text-[10px] text-slate-400 mt-0.5">CPU Queue & Scheduling</span>
          </button>
          <button onclick="launchLab('memory')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-memory text-2xl text-sky-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">2. Memory Mgr</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Dynamic RAM Allocation</span>
          </button>
          <button onclick="launchLab('pnp')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-plug text-2xl text-emerald-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">3. Plug-and-Play</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Connect & Unplug Hardware</span>
          </button>
          <button onclick="launchLab('file-explorer')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-folder-tree text-2xl text-purple-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">4. File System</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Folders, Files & Editor</span>
          </button>
          <button onclick="launchLab('disk')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-hard-drive text-2xl text-pink-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">5. Disk Mgr</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Partitioning & Formatting</span>
          </button>
          <button onclick="launchLab('ui-customizer')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-palette text-2xl text-yellow-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">6. UI Customizer</span>
            <span class="text-[10px] text-slate-400 mt-0.5">High Contrast Themes</span>
          </button>
          <button onclick="launchLab('user-mgr')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-user-shield text-2xl text-indigo-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">7. Admin User Mgr</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Add & Delete Accounts</span>
          </button>
          <button onclick="launchLab('multitasking')" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-left flex flex-col items-start transition-all hover:border-amber-400/50">
            <i class="fa-solid fa-window-restore text-2xl text-teal-400 mb-2"></i>
            <span class="font-bold text-slate-100 text-xs">8. Multitasking</span>
            <span class="text-[10px] text-slate-400 mt-0.5">Run Live Mini-Apps</span>
          </button>
        </div>
        <div id="active-lab-container" class="mt-4">
          <!-- Lab interactive panel rendered here -->
        </div>
      `;
    }

    function launchLab(labId) {
      playAudio('click');
      activeLab = labId;
      const container = document.getElementById('active-lab-container');
      if (!container) return;

      if (labId === 'process') {
        container.innerHTML = getProcessLabHTML();
      } else if (labId === 'memory') {
        container.innerHTML = getMemoryLabHTML();
        renderRAMBlocks();
      } else if (labId === 'pnp') {
        container.innerHTML = getPnPLabHTML();
      } else if (labId === 'file-explorer') {
        container.innerHTML = getFileExplorerHTML();
        renderFileExplorer();
      } else if (labId === 'disk') {
        container.innerHTML = getDiskLabHTML();
      } else if (labId === 'ui-customizer') {
        container.innerHTML = getUICustomizerHTML();
      } else if (labId === 'user-mgr') {
        container.innerHTML = getUserManagerHTML();
        renderUserList();
      } else if (labId === 'multitasking') {
        container.innerHTML = getMultitaskingLabHTML();
      }
    }

    /* PROCESS LAB */
    let runningProcesses = [
      { id: 101, name: 'Browser.exe', status: 'Running', cpu: '15%' },
      { id: 102, name: 'WordProcessor.exe', status: 'Running', cpu: '8%' }
    ];

    function getProcessLabHTML() {
      return `
        <div class="bg-slate-950 p-4 rounded-xl border border-amber-500/30 space-y-3">
          <div class="flex justify-between items-center border-b border-white/10 pb-2">
            <span class="font-bold text-amber-300 text-xs flex items-center space-x-2">
              <i class="fa-solid fa-microchip text-amber-400"></i>

      grid.innerHTML = ramGrid.map((block, idx) => `
        <div class="h-12 rounded-lg border ${block ? 'bg-sky-600/80 border-sky-400 text-white' : 'bg-slate-900 border-white/10 text-slate-600'} flex flex-col items-center justify-center font-mono text-[10px] font-bold shadow">

    }

    function allocateRAM(name, sizeMB) {
      let freeSlots = ramGrid.map((val, idx) => val === null ? idx : -1).filter(idx => idx !== -1);
      if (freeSlots.length < sizeMB) {
        showToast('Memory Full', 'Not enough free RAM blocks available!', 'error');
        return;
      }
      playAudio('success');
      for (let i = 0; i < sizeMB; i++) {
        ramGrid[freeSlots[i]] = name;
      }
      renderRAMBlocks();
      showToast('RAM Allocated', `Allocated ${sizeMB} MB RAM for ${name}`, 'success');
    }

    function clearRAM() {
      playAudio('eject');
      ramGrid = Array(16).fill(null);

      if (!panel || !input) return;

      label.innerText = type === 'folder' ? 'New Folder Name:' : 'New File Name (.txt):';

      panel.classList.remove('hidden');
      input.focus();

    function hideCreateItemModal() {
      const panel = document.getElementById('explorer-create-panel');
      if (panel) panel.classList.add('hidden');
    }

    function submitCreateItem() {
      const input = document.getElementById('create-item-input');
      if (!input || !input.value.trim()) return;

      const name = input.value.trim();
      const newItem = creatingItemType === 'folder'
        ? { id: 'f_' + Date.now(), name: name, type: 'folder', items: [] }
        : { id: 'file_' + Date.now(), name: name.endsWith('.txt') ? name : name + '.txt', type: 'file', content: 'Sample text content inside ' + name };

      if (currentFolderId) {
        const parentFolder = fileTree.find(f => f.id === currentFolderId);
        if (parentFolder) parentFolder.items.push(newItem);
      } else {
        fileTree.push(newItem);
      }

      hideCreateItemModal();
      playAudio('success');
      renderFileExplorer();
      showToast('Item Created', `Successfully created ${creatingItemType} "${name}"!`, 'success');
    }

    function getCurrentFolderItems() {
      if (currentFolderId) {
        const folder = fileTree.find(f => f.id === currentFolderId);
        return folder ? folder.items : [];
      }
      return fileTree;
    }

    function renderFileExplorer() {
      const grid = document.getElementById('file-items-grid');
      const pathEl = document.getElementById('file-explorer-path');
      if (!grid) return;

      let itemsToRender = getCurrentFolderItems();
      if (currentFolderId) {
        const currentFolder = fileTree.find(f => f.id === currentFolderId);
        if (pathEl) pathEl.innerText = `Path: C:\\${currentFolder ? currentFolder.name : ''}\\>`;

                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
          `;
        } else {
          html += `
            <div class="group relative flex flex-col items-center justify-center p-3 bg-slate-900 border border-white/10 hover:bg-slate-800 hover:border-sky-400 rounded-xl cursor-pointer transition-all shadow">
              <div onclick="openFileViewer('${item.id}')" class="flex flex-col items-center w-full">
                <i class="fa-solid fa-file-lines text-sky-400 text-4xl mb-1"></i>
                <span class="text-xs text-slate-100 font-semibold text-center truncate w-24">${item.name}</span>
              </div>
              <button onclick="deleteExplorerItem('${item.id}', false)" class="absolute top-1 right-1 opacity-80 p-1 text-red-400 hover:text-red-300">
                <i class="fa-solid fa-trash-can text-xs"></i>

    function openFileViewer(fileId) {

      activeOpenedFile = file;
      const viewer = document.getElementById('file-content-viewer');

        body.value = file.content || '';
        viewer.classList.remove('hidden');
      }

      activeOpenedFile = null;

    function handleCLIBuyKey(e) {
      if (e.key === 'Enter') submitCLICommand();
    }

    function submitCLICommand() {
      const input = document.getElementById('cli-input');
      const output = document.getElementById('cli-output');
      if (!input || !output || !input.value.trim()) return;

      playAudio('click');
      const cmdRaw = input.value.trim();
      const parts = cmdRaw.split(' ');
      const cmd = parts[0].toLowerCase();
      const arg = parts.slice(1).join(' ');

      const line = document.createElement('div');
      line.className = 'text-slate-300';
      line.innerText = `C:\\Users> ${cmdRaw}`;
      output.appendChild(line);

      const resp = document.createElement('div');
      resp.className = 'text-emerald-400 pl-2 border-l border-emerald-500/40 my-1';

      if (cmd === 'help') {
        resp.innerHTML = `
          <div class="text-yellow-300 font-bold">Commands:</div>
          <div><b class="text-white">dir</b> - List directory</div>
          <div><b class="text-white">mkdir [name]</b> - Create folder</div>
          <div><b class="text-white">echo [text]</b> - Print message</div>
          <div><b class="text-white">ver</b> - OS version</div>
          <div><b class="text-white">cls</b> - Clear screen</div>
        `;
      } else if (cmd === 'dir') {
        resp.innerHTML = `
          <div>Directory of C:\\Users</div>
          <div class="text-slate-400">10/05/2026  &lt;DIR&gt;  Documents</div>
          <div class="text-slate-400">10/05/2026  &lt;DIR&gt;  Pictures</div>
        `;
      } else if (cmd === 'mkdir') {
        if (!arg) {
          resp.className = 'text-red-400 pl-2';
          resp.innerText = 'Syntax Error: Please specify folder name (e.g. mkdir Project)';
        } else {
          resp.innerText = `[OK] Directory "${arg}" created via CLI command.`;
        }
      } else if (cmd === 'echo') {
        resp.innerText = arg || 'ECHO is active.';
      } else if (cmd === 'ver') {
        resp.innerText = 'Secondary 1 OS Interactive Kernel v10.0.2026';
      } else if (cmd === 'cls' || cmd === 'clear') {
        output.innerHTML = '';
        input.value = '';
        return;
      } else {
        resp.className = 'text-red-400 pl-2';
        resp.innerText = `'${cmd}' is not recognized. Type "help" for command list.`;
      }

      output.appendChild(resp);
      input.value = '';
      output.scrollTop = output.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', () => {
