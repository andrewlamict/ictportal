<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Machine Cycle</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #090d16;
            color: #f8fafc;
            user-select: none;
            overflow-x: hidden;
        }

        .cycle-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        .station-node {
            position: absolute;
            width: 64px;
            height: 64px;
            margin-left: -32px;
            margin-top: -32px;
            transition: all 0.3s ease;
        }

        @media (min-width: 640px) {
            .station-node {
                width: 72px;
                height: 72px;
                margin-left: -36px;
                margin-top: -36px;
            }
        }

        .station-node.active {
            transform: scale(1.2);
            z-index: 30;
        }

        .station-node.active .node-inner {
            border-color: currentColor;
            box-shadow: 0 0 20px currentColor;
        }

        /* Pulsing active data dot */
        #active-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            z-index: 40;
            pointer-events: none;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1), top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 max-w-xl mx-auto">

    <!-- HEADER -->
    <header class="text-center mt-2 mb-3 w-full">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-emerald-400">
            CPU Machine Cycle
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-0.5">
            Task: <span class="text-cyan-300 font-bold bg-slate-900 px-2 py-0.5 rounded-lg border border-slate-800">5 + 3 = 8</span>
        </p>

        <!-- 4 MAIN PHASES PROGRESS BAR -->
        <div class="grid grid-cols-4 gap-1 sm:gap-2 mt-3 max-w-md mx-auto px-1">
            <div id="phase-pill-0" class="phase-pill px-1.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-center transition-all">
                <div class="text-[10px] font-black uppercase text-cyan-400 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-download"></i> <span>1. FETCH</span>
                </div>
            </div>
            <div id="phase-pill-1" class="phase-pill px-1.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-center transition-all">
                <div class="text-[10px] font-black uppercase text-purple-400 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-magnifying-glass"></i> <span>2. DECODE</span>
                </div>
            </div>
            <div id="phase-pill-2" class="phase-pill px-1.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-center transition-all">
                <div class="text-[10px] font-black uppercase text-amber-400 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-bolt"></i> <span>3. EXECUTE</span>
                </div>
            </div>
            <div id="phase-pill-3" class="phase-pill px-1.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-center transition-all">
                <div class="text-[10px] font-black uppercase text-emerald-400 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-floppy-disk"></i> <span>4. STORE</span>
                </div>
            </div>
        </div>
    </header>

    <!-- CIRCULAR CYCLE DISPLAY -->
    <main class="cycle-wrapper w-full flex-1 flex items-center justify-center relative my-2">
            <!-- Pulsing Active Dot -->
            <div id="active-dot" class="rounded-full bg-cyan-400 shadow-[0_0_12px_#38bdf8]"></div>

            <!-- CENTRAL SPOTLIGHT CARD -->
            <div id="central-card" class="w-56 h-56 sm:w-64 sm:h-64 rounded-full bg-slate-900 border-4 border-cyan-400 p-4 flex flex-col items-center justify-center text-center shadow-2xl z-20 backdrop-blur-lg transition-all duration-300">
                <!-- Main Cycle Phase Badge -->
                <div id="macro-phase-badge" class="px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 mb-1 flex items-center gap-1">
                    <i id="macro-phase-icon" class="fa-solid fa-download"></i> <span id="macro-phase-text">FETCH STAGE</span>
                </div>

                <span id="step-badge" class="text-[9px] font-bold uppercase text-slate-400 mb-0.5">
                    Step 1 of 8
                </span>

                <i id="step-icon" class="fa-solid fa-bookmark text-2xl text-cyan-400 my-0.5"></i>

                <h2 id="step-title" class="text-sm sm:text-base font-bold text-white leading-tight">
                    Program Counter
                </h2>

                <div class="w-full bg-slate-950 rounded-lg px-2 py-1 my-1 border border-slate-800">
                    <span class="text-[8px] text-slate-500 uppercase font-bold block">Current Data:</span>
                    <span id="step-value" class="font-mono font-black text-xs text-cyan-300 truncate block">
                        Line 1
                    </span>
                </div>

                <p id="step-desc" class="text-[10px] text-slate-300 leading-tight">
                    Holds the memory line number of the next instruction.
                </p>
            </div>

            <!-- 8 STATIONS IN A CIRCLE -->
            <div id="station-0" onclick="goToStep(0)" class="station-node cursor-pointer">
                <div class="node-inner w-full h-full rounded-2xl bg-slate-900 border-2 border-cyan-500/40 text-cyan-400 flex flex-col items-center justify-center shadow-md hover:scale-105 transition">
                    <i class="fa-solid fa-bookmark text-xs sm:text-sm"></i>
                    <span class="font-bold text-[9px] text-slate-200 mt-0.5">1. PC</span>
                </div>
            </div>

            <div id="station-1" onclick="goToStep(1)" class="station-node cursor-pointer">
                <div class="node-inner w-full h-full rounded-2xl bg-slate-900 border-2 border-cyan-500/40 text-cyan-400 flex flex-col items-center justify-center shadow-md hover:scale-105 transition">
                    <i class="fa-solid fa-map-pin text-xs sm:text-sm"></i>
                    <span class="font-bold text-[9px] text-slate-200 mt-0.5">2. MAR</span>
                </div>
            </div>

            <div id="station-2" onclick="goToStep(2)" class="station-node cursor-pointer">
                <div class="node-inner w-full h-full rounded-2xl bg-slate-900 border-2 border-cyan-500/40 text-cyan-400 flex flex-col items-center justify-center shadow-md hover:scale-105 transition">
                    <i class="fa-solid fa-memory text-xs sm:text-sm"></i>
                    <span class="font-bold text-[9px] text-slate-200 mt-0.5">3. RAM</span>
                </div>
            </div>

            <div id="station-3" onclick="goToStep(3)" class="station-node cursor-pointer">
                <div class="node-inner w-full h-full rounded-2xl bg-slate-900 border-2 border-cyan-500/40 text-cyan-400 flex flex-col items-center justify-center shadow-md hover:scale-105 transition">
                    <i class="fa-solid fa-box-open text-xs sm:text-sm"></i>
                    <span class="font-bold text-[9px] text-slate-200 mt-0.5">4. MDR</span>
                </div>
            </div>

            <div id="station-4" onclick="goToStep(4)" class="station-node cursor-pointer">
                <div class="node-inner w-full h-full rounded-2xl bg-slate-900 border-2 border-purple-500/40 text-purple-400 flex flex-col items-center justify-center shadow-md hover:scale-105 transition">
                    <i class="fa-solid fa-receipt text-xs sm:text-sm"></i>
                    <span class="font-bold text-[9px] text-slate-200 mt-0.5">5. CIR</span>
                </div>
            </div>

            <div id="station-5" onclick="goToStep(5)" class="station-node cursor-pointer">
                <div class="node-inner w-full h-full rounded-2xl bg-slate-900 border-2 border-purple-500/40 text-purple-400 flex flex-col items-center justify-center shadow-md hover:scale-105 transition">
                    <i class="fa-solid fa-brain text-xs sm:text-sm"></i>
                    <span class="font-bold text-[9px] text-slate-200 mt-0.5">6. CU</span>
                </div>
            </div>

            <div id="station-6" onclick="goToStep(6)" class="station-node cursor-pointer">
                <div class="node-inner w-full h-full rounded-2xl bg-slate-900 border-2 border-amber-500/40 text-amber-400 flex flex-col items-center justify-center shadow-md hover:scale-105 transition">
                    <i class="fa-solid fa-calculator text-xs sm:text-sm"></i>
                    <span class="font-bold text-[9px] text-slate-200 mt-0.5">7. ALU</span>
                </div>
            </div>

            <div id="station-7" onclick="goToStep(7)" class="station-node cursor-pointer">
                <div class="node-inner w-full h-full rounded-2xl bg-slate-900 border-2 border-emerald-500/40 text-emerald-400 flex flex-col items-center justify-center shadow-md hover:scale-105 transition">
                    <i class="fa-solid fa-vault text-xs sm:text-sm"></i>
                    <span class="font-bold text-[9px] text-slate-200 mt-0.5">8. ACC</span>
                </div>
            </div>
    </main>

    <!-- BOTTOM CONTROLS -->
    <footer class="w-full bg-slate-900 border border-slate-800 p-3 rounded-2xl shadow-xl flex items-center justify-between gap-2 mt-2">
        <!-- Reset Button -->
        <button onclick="resetCycle()" class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-rotate-left"></i> Reset
        </button>

        <!-- Auto Play Toggle -->
        <button id="auto-btn" onclick="toggleAutoPlay()" class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-play" id="auto-icon"></i> <span id="auto-text">Auto</span>
        </button>

        <!-- Big Next Button -->
        <button onclick="nextStep()" class="flex-1 max-w-xs py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold text-sm rounded-xl transition shadow-lg shadow-cyan-500/25 flex items-center justify-center gap-2">
            NEXT STEP <i class="fa-solid fa-arrow-right"></i>
        </button>
    </footer>

    <script>
        // 8 Steps Definitions with Machine Cycle Phase mappings
        const STEPS = [
            {
                name: 'Program Counter (PC)',
                phase: 'FETCH',
                phaseIdx: 0,
                phaseIcon: 'fa-bookmark',
                color: '#38bdf8',
                desc: '[FETCH] Holds the memory address of the next instruction to fetch.',
                getValue: (line) => line === 1 ? 'Address: Line 1' : 'Address: Line 2'
            },
            {
                name: 'Memory Address Register (MAR)',
                phase: 'FETCH',
                phaseIdx: 0,
                phaseIcon: 'fa-map-pin',
                color: '#38bdf8',
                desc: '[FETCH] Sends the address along the address bus to memory.',
                getValue: (line) => line === 1 ? 'Target Address: Line 1' : 'Target Address: Line 2'
            },
            {
                name: 'Main Memory (RAM)',
                phase: 'FETCH',
                phaseIdx: 0,
                phaseIcon: 'fa-memory',
                color: '#38bdf8',
                desc: '[FETCH] Locates the instruction stored at the requested address.',
                getValue: (line) => line === 1 ? 'Found: "LOAD 5"' : 'Found: "ADD 3"'
            },
            {
                name: 'Memory Data Register (MDR)',
                phase: 'FETCH',
                phaseIdx: 0,
                phaseIcon: 'fa-box-open',
                color: '#38bdf8',
                desc: '[FETCH] Receives and holds the fetched data from RAM.',
                getValue: (line) => line === 1 ? 'Holding: "LOAD 5"' : 'Holding: "ADD 3"'
            },
            {
                name: 'Current Instruction Register (CIR)',
                phase: 'DECODE',
                phaseIdx: 1,
                phaseIcon: 'fa-receipt',
                color: '#c084fc',
                desc: '[DECODE] Holds the current instruction ready for decoding.',
                getValue: (line) => line === 1 ? 'Active: "LOAD 5"' : 'Active: "ADD 3"'
            },
            {
                name: 'Control Unit (CU)',
                phase: 'DECODE',
                phaseIdx: 1,
                phaseIcon: 'fa-brain',
                color: '#c084fc',
                desc: '[DECODE] Decodes the command and sends out control signals.',
                getValue: (line) => line === 1 ? 'Command: LOAD' : 'Command: ADD'
            },
            {
                name: 'Arithmetic Logic Unit (ALU)',
                phase: 'EXECUTE',
                phaseIdx: 2,
                phaseIcon: 'fa-calculator',
                color: '#fbbf24',
                desc: '[EXECUTE] Performs arithmetic operations or calculations.',
                getValue: (line, acc) => line === 1 ? 'Calc: Set to 5' : `Calc: 5 + 3`
            },
            {
                name: 'Accumulator (ACC)',
                phase: 'STORE',
                phaseIdx: 3,
                phaseIcon: 'fa-vault',
                color: '#34d399',
                desc: '[STORE] Saves the final result from the ALU.',
                getValue: (line, acc) => `Stored Result = ${acc}`
            }
        ];

        // State variables
        let currentStep = 0; // 0 to 7
        let currentLine = 1; // Line 1 ("LOAD 5"), Line 2 ("ADD 3")
        let accValue = 0;
        let isAuto = false;
        let autoTimer = null;

        // Position station nodes around the circular wrapper
        function layoutNodes() {
            const container = document.querySelector('.cycle-wrapper');
            if (!container) return;

            const total = 8;
            const radius = window.innerWidth < 640 ? 120 : 140; // px radius
            const cx = container.clientWidth / 2;
            const cy = container.clientHeight / 2;

            for (let i = 0; i < total; i++) {
                const node = document.getElementById(`station-${i}`);
                if (!node) continue;
                const angle = ((i * (360 / total)) - 90) * (Math.PI / 180);
                const x = cx + radius * Math.cos(angle);
                const y = cy + radius * Math.sin(angle);

                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
            }
            updateActiveDot();
        }

        // Move the active dot indicator
        function updateActiveDot() {
            const node = document.getElementById(`station-${currentStep}`);
            const dot = document.getElementById('active-dot');
            if (node && dot) {
                dot.style.left = node.style.left;
                dot.style.top = node.style.top;
                dot.style.backgroundColor = STEPS[currentStep].color;
                dot.style.boxShadow = `0 0 14px ${STEPS[currentStep].color}`;
            }
        }

        // Render current step state to UI
        function renderUI() {
            const stepInfo = STEPS[currentStep];

            // Calculate state results
            if (currentStep === 7) {
                if (currentLine === 1) accValue = 5;
                else if (currentLine === 2) accValue = 8;
            }

            // Macro Phase Header Bar Updates
            for (let p = 0; p < 4; p++) {
                const pill = document.getElementById(`phase-pill-${p}`);
                if (pill) {
                    if (p === stepInfo.phaseIdx) {
                        pill.className = 'phase-pill px-1.5 py-1.5 rounded-xl bg-slate-800 border-2 border-cyan-400 shadow-lg text-center scale-105 transition-all';
                    } else {
                        pill.className = 'phase-pill px-1.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 opacity-60 text-center transition-all';
                    }
                }
            }

            // Central Card updates
            document.getElementById('macro-phase-text').textContent = `${stepInfo.phase} STAGE`;
            document.getElementById('macro-phase-icon').className = `fa-solid ${stepInfo.phaseIcon}`;
            document.getElementById('macro-phase-badge').style.color = stepInfo.color;
            document.getElementById('macro-phase-badge').style.borderColor = stepInfo.color;

            document.getElementById('step-badge').textContent = `Step ${currentStep + 1} of 8 (Line ${currentLine})`;
            document.getElementById('step-title').textContent = stepInfo.name;
            document.getElementById('step-value').textContent = stepInfo.getValue(currentLine, accValue);
            document.getElementById('step-desc').textContent = stepInfo.desc;

            // Icon and Border colors
            const iconEl = document.getElementById('step-icon');
            iconEl.className = `fa-solid ${stepInfo.phaseIcon} text-2xl my-0.5`;
            iconEl.style.color = stepInfo.color;
            document.getElementById('central-card').style.borderColor = stepInfo.color;

            // Highlight station nodes
            for (let i = 0; i < 8; i++) {
                const node = document.getElementById(`station-${i}`);
                if (node) {
                    if (i === currentStep) {
                        node.classList.add('active');
                        node.style.color = stepInfo.color;
                    } else {
                        node.classList.remove('active');
                        node.style.color = '';
                    }
                }
            }

            updateActiveDot();
        }

        // Step Forward
        function nextStep() {
            if (currentStep >= 7) {
                currentStep = 0;
                currentLine = currentLine === 1 ? 2 : 1; // Toggle between Line 1 ("LOAD 5") and Line 2 ("ADD 3")
            } else {
                currentStep++;
            }
            renderUI();
        }

        // Direct Station Click
        function goToStep(index) {
            currentStep = index;
            renderUI();
        }

        // Auto Play Toggle
        function toggleAutoPlay() {
            isAuto = !isAuto;
            const btn = document.getElementById('auto-btn');
            const icon = document.getElementById('auto-icon');
            const text = document.getElementById('auto-text');

            if (isAuto) {
                btn.className = 'px-3 py-2.5 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs transition flex items-center gap-1.5 shadow-md shadow-amber-500/20';
                icon.className = 'fa-solid fa-pause';
                text.textContent = 'Pause';
                autoTimer = setInterval(nextStep, 1500);
            } else {
                btn.className = 'px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5';
                icon.className = 'fa-solid fa-play';
                text.textContent = 'Auto';
                clearInterval(autoTimer);
            }
        }

        // Reset
        function resetCycle() {
            if (isAuto) toggleAutoPlay();
            currentStep = 0;
            currentLine = 1;
            accValue = 0;
            renderUI();
        }

        // Initial setup on window load
        window.addEventListener('load', () => {
            layoutNodes();
            renderUI();
        });

        // Handle browser window resize
        window.addEventListener('resize', () => {
            layoutNodes();
        });
    </script>
</body>
</html>
