<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Lab Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Lexend:wght@300;600&family=Indie+Flower&display=swap');
        body { background-color: #f8fafc; font-family: 'Lexend', sans-serif; color: #1e293b; }
        .notebook-cell { background: white; border-radius: 16px; box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05); overflow: hidden; border: 1px solid #e2e8f0; }
        .paper-output { 
            background-color: #fffdf5; 
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px); 
            background-size: 100% 28px;
            position: relative; 
            min-height: 550px; 
            padding-left: 50px !important; 
            padding-top: 24px !important; 
        }
        .paper-output::before { content: ''; position: absolute; left: 40px; top: 0; bottom: 0; width: 1px; background: #fca5a5; }
        .handwritten { font-family: 'Indie Flower', cursive; font-size: 1.2rem; line-height: 28px; color: #1e40af; white-space: pre-wrap; }
        #line-pointer { position: absolute; left: 4px; color: #6366f1; transition: top 0.15s ease; z-index: 20; font-weight: bold; }
        #active-line-bg { position: absolute; left: 0; right: 0; height: 28px; background: rgba(99, 102, 241, 0.08); pointer-events: none; transition: top 0.15s ease; z-index: 10; }
        textarea#code-editor { tab-size: 4; caret-color: #6366f1; spellcheck: false; line-height: 28px; white-space: pre; overflow-x: auto; background: transparent; }
        .input-line-wrapper { display: inline-flex; align-items: baseline; width: 100%; gap: 8px; }
        .input-cursor-area { border-bottom: 1px dashed #94a3b8; background: transparent; font-family: inherit; font-size: inherit; color: #ef4444; outline: none; flex-grow: 1; padding: 0; margin: 0; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex flex-col md:row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m10 16 1.5-1.5"/><path d="m14 8-1.5 1.5"/><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Python Lab Pro</h1>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Compiler Simulation v5.0</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="execute(true)" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all active:scale-95">Run All</button>
                <button id="nextBtn" disabled onclick="triggerNext()" class="bg-white text-slate-700 border border-slate-200 px-6 py-3 rounded-xl font-bold hover:bg-slate-50 transition-all active:scale-95">Step ▶</button>
                <button onclick="location.reload()" class="bg-slate-100 text-slate-500 px-4 py-3 rounded-xl font-bold hover:bg-slate-200 transition-all">Reset</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5">
                <div class="notebook-cell bg-[#0f172a] h-full">
                    <div class="px-4 py-3 bg-[#1e293b] border-b border-white/5 flex justify-between items-center">
                        <span class="text-indigo-400 font-mono text-xs font-bold tracking-widest">CODE EDITOR</span>
                    </div>
                    <div class="relative p-4">
                        <div id="line-pointer" class="hidden">▶</div>
                        <div id="active-line-bg" class="hidden"></div>
                        <textarea id="code-editor" class="w-full h-[600px] text-indigo-100 font-mono text-[14px] outline-none resize-none" spellcheck="false"></textarea>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7">
                <div class="notebook-cell h-full flex flex-col">
                    <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-400 tracking-widest">OUTPUT PAPER</div>
                    <div id="terminal" class="paper-output handwritten p-6 overflow-y-auto"></div>
                </div>
            </div>

            <div class="lg:col-span-12">
                <div class="bg-white rounded-2xl p-6 border border-slate-200">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-[0.2em] mb-6">Variable Watcher</h3>
                    <div id="memory-viz" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 min-h-[60px]"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('code-editor');
        const terminal = document.getElementById('terminal');
        const memoryViz = document.getElementById('memory-viz');
        const nextBtn = document.getElementById('nextBtn');
        const ptr = document.getElementById('line-pointer');
        const lineBg = document.getElementById('active-line-bg');

        const DEFAULT_CODE = `num = input("Input a number: ")
result = num * 2
print("String result:", result)

# 3. Handle int/float casting
val = int(num)
print("Math result:", val * 2 + (10 / 2))

# 8-9. If...elif...else logic
if val > 100 and val < 200:
    print("It's between 100 and 200")
elif val >= 200 or not val < 0:
    print("It's large or positive")
else:
    print("It's negative")

# 10. Rounding
pi = 3.14159265
print("Pi rounded:", round(pi, 2))`;

        editor.value = DEFAULT_CODE;
        let vars = {};
        let nextResolve = null;
        let isRunning = false;

        function triggerNext() { if (nextResolve) { nextResolve(); nextResolve = null; } }

        function getIndent(line) {
            if (!line.trim()) return -1;
            return line.match(/^ */)[0].length;
        }

        async function pythonEval(expr) {
            expr = expr.trim();
            if (!expr) return undefined;

            // Handle Strings
            if ((expr.startsWith('"') && expr.endsWith('"')) || (expr.startsWith("'") && expr.endsWith("'"))) {
                return expr.slice(1, -1);
            }

            // Handle Functions
            if (expr.startsWith('input(')) {
                const prompt = await pythonEval(expr.slice(6, -1));
                return await askInput(prompt || "");
            }
            if (expr.startsWith('int(')) return parseInt(await pythonEval(expr.slice(4, -1)));
            if (expr.startsWith('float(')) return parseFloat(await pythonEval(expr.slice(6, -1)));
            if (expr.startsWith('round(')) {
                const args = splitTopLevel(expr.slice(6, -1), ',');
                const val = await pythonEval(args[0]);
                const places = args[1] ? await pythonEval(args[1]) : 0;
                return Number(val.toFixed(places));
            }

            // Replace Python operators and keywords for JS evaluation
            let processed = expr
                .replace(/\band\b/g, '&&')
                .replace(/\bor\b/g, '||')
                .replace(/\bnot\b/g, '!')
                .replace(/\bTrue\b/g, 'true')
                .replace(/\bFalse\b/g, 'false')
                .replace(/\/\//g, '/0|') // Integer division trick
                .replace(/\*\*/g, '**');

            // Replace variables
            const tokens = processed.split(/(\s+|\+|\-|\*|\/|\(|\)|\!|\&|\||\>|\<|\=|\%)/);
            const mapped = await Promise.all(tokens.map(async t => {
                const trimmed = t.trim();
                if (!trimmed) return t;
                if (vars.hasOwnProperty(trimmed)) {
                    return JSON.stringify(vars[trimmed]);
                }
                return t;
            }));

            try {
                // Special handling for string * number
                let finalExpr = mapped.join('');
                
                // Detection of String * Number pattern in JS space
                if (finalExpr.includes('*')) {
                    const parts = finalExpr.split('*');
                    if (parts.length === 2) {
                        let a = eval(parts[0]);
                        let b = eval(parts[1]);
                        if (typeof a === 'string' && typeof b === 'number') return a.repeat(b);
                        if (typeof b === 'string' && typeof a === 'number') return b.repeat(a);
                    }
                }

                // Integer division processing
                if (finalExpr.includes('/0|')) {
                    finalExpr = finalExpr.replace(/(\d+)\/0\|(\d+)/g, 'Math.floor($1/$2)');
                }

                return eval(finalExpr);
            } catch (e) {
                return expr;
            }
        }

        function splitTopLevel(str, separator) {
            let results = [];
            let current = "";
            let depth = 0;
            let inQuote = false;
            for (let char of str) {
                if (char === '"' || char === "'") inQuote = !inQuote;
                if (!inQuote) {
                    if (char === '(') depth++;
                    if (char === ')') depth--;
                    if (char === separator && depth === 0) {
                        results.push(current.trim());
                        current = "";
                        continue;
                    }
                }
                current += char;
            }
            results.push(current.trim());
            return results;
        }

        async function askInput(promptText) {
            return new Promise((resolve) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'input-line-wrapper animate-in fade-in slide-in-from-bottom-1';
                const promptSpan = document.createElement('span');
                promptSpan.textContent = promptText;
                const inputField = document.createElement('input');
                inputField.type = 'text';
                inputField.className = 'input-cursor-area';
                wrapper.append(promptSpan, inputField);
                terminal.appendChild(wrapper);
                inputField.focus();
                terminal.scrollTop = terminal.scrollHeight;
                inputField.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        const val = inputField.value;
                        inputField.disabled = true;
                        inputField.classList.remove('input-cursor-area');
                        resolve(String(val));
                    }
                };
            });
        }

        async function execute(auto) {
            if (isRunning) return;
            isRunning = true;
            vars = {}; terminal.innerHTML = ""; memoryViz.innerHTML = "";
            nextBtn.disabled = false;
            
            const lines = editor.value.split('\n');
            let i = 0;
            let skipUntilIndent = -1;
            let lastConditionMet = false;

            while (i < lines.length) {
                const fullLine = lines[i];
                const lineTrim = fullLine.trim();
                const currentIndent = getIndent(fullLine);

                // Skip logic for blocks
                if (skipUntilIndent !== -1) {
                    if (currentIndent > skipUntilIndent || !lineTrim) { i++; continue; }
                    else { skipUntilIndent = -1; }
                }

                if (!lineTrim || lineTrim.startsWith('#')) { i++; continue; }

                ptr.classList.remove('hidden'); lineBg.classList.remove('hidden');
                ptr.style.top = (16 + i*28) + 'px'; lineBg.style.top = (16 + i*28) + 'px';

                if (!auto) await new Promise(r => nextResolve = r);
                else await new Promise(r => setTimeout(r, 100));

                // Control Flow: IF
                if (lineTrim.startsWith('if ')) {
                    const condition = lineTrim.slice(3, -1);
                    lastConditionMet = !!(await pythonEval(condition));
                    if (!lastConditionMet) skipUntilIndent = currentIndent;
                }
                // Control Flow: ELIF
                else if (lineTrim.startsWith('elif ')) {
                    if (lastConditionMet) {
                        skipUntilIndent = currentIndent;
                    } else {
                        const condition = lineTrim.slice(5, -1);
                        lastConditionMet = !!(await pythonEval(condition));
                        if (!lastConditionMet) skipUntilIndent = currentIndent;
                    }
                }
                // Control Flow: ELSE
                else if (lineTrim.startsWith('else:')) {
                    if (lastConditionMet) skipUntilIndent = currentIndent;
                }
                // Output: PRINT
                else if (lineTrim.startsWith('print(')) {
                    const argsStr = lineTrim.slice(6, -1);
                    const args = splitTopLevel(argsStr, ',');
                    let out = [];
                    for(let a of args) out.push(await pythonEval(a));
                    
                    const div = document.createElement('div');
                    div.className = 'animate-in fade-in slide-in-from-left-2';
                    div.textContent = out.join(' ');
                    terminal.appendChild(div);
                    terminal.scrollTop = terminal.scrollHeight;
                }
                // Assignment
                else if (lineTrim.includes('=')) {
                    const [name, valPart] = lineTrim.split('=').map(s => s.trim());
                    vars[name] = await pythonEval(valPart);
                    updateMemoryUI();
                }

                i++;
            }
            ptr.classList.add('hidden'); lineBg.classList.add('hidden');
            nextBtn.disabled = true; isRunning = false;
        }

        function updateMemoryUI() {
            memoryViz.innerHTML = "";
            Object.entries(vars).forEach(([name, value]) => {
                const box = document.createElement('div');
                box.className = 'bg-slate-50 border border-slate-100 p-3 rounded-xl shadow-sm';
                const type = typeof value === 'number' ? (Number.isInteger(value) ? 'int' : 'float') : (typeof value === 'boolean' ? 'bool' : 'str');
                box.innerHTML = `
                    <div class="text-[9px] font-black text-indigo-400 uppercase tracking-tighter mb-1">${name}</div>
                    <div class="text-sm font-bold text-slate-800 truncate">${value}</div>
                    <div class="text-[8px] text-slate-300 font-bold uppercase mt-1">${type}</div>`;
                memoryViz.appendChild(box);
            });
        }

        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(this.selectionEnd);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });
    </script>
</body>
</html>
