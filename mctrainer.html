<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT MC Trainer</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="firebase-config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
:root{--bg:#0b1020;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--txt:#f8fafc;--mut:#cbd5e1;--ind:#6366f1;--vio:#a855f7;--ok:#34d399;--bad:#fb7185;--gold:#fbbf24}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:'Outfit',system-ui,sans-serif;color:var(--txt);min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,#312e81 0,transparent 60%),radial-gradient(900px 600px at 100% 10%,#581c87 0,transparent 55%),var(--bg);position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;pointer-events:none;animation:float 18s ease-in-out infinite alternate}
body::before{background:#4f46e5;left:-12vmax;bottom:-18vmax}
body::after{background:#db2777;right:-14vmax;top:30vh;animation-delay:-8s}
@keyframes float{to{transform:translate(6vmax,-5vmax) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px)}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
/* header */
.hdr{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:12px;flex-wrap:wrap}
.homebtn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:800;font-size:13px;text-decoration:none;box-shadow:0 6px 18px rgba(239,68,68,.35)}
.homebtn:hover{filter:brightness(1.1)}
.logo{font-weight:800;font-size:19px;letter-spacing:.02em;margin-right:auto}
.logo span{background:linear-gradient(90deg,#a5b4fc,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.xpbox{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px}
.xpbar{width:110px;height:9px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34d399,#fbbf24);transition:width .8s}
.rank{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(251,191,36,.2);color:#fde68a;text-transform:uppercase;letter-spacing:.08em}
.gear{border:0;background:rgba(255,255,255,.1);color:#fff;width:36px;height:36px;border-radius:10px;font-size:17px}
/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1;min-width:110px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mut);padding:11px 8px;border-radius:14px;font-weight:800;font-size:13px;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,var(--ind),var(--vio));color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(99,102,241,.4)}
.tab b{background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px}
.pane{padding:22px;animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;font-size:22px}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
/* topic cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{text-align:left;color:var(--txt);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:18px;padding:16px;transition:.2s;position:relative;overflow:hidden}
.tcard:hover{transform:translateY(-3px);border-color:#a5b4fc;box-shadow:0 10px 26px rgba(99,102,241,.3)}
.tcard h3{margin:0 0 6px;font-size:16px}
.tcard small{color:var(--mut);font-size:12px;font-weight:600}
.stars{float:right;letter-spacing:2px;color:rgba(255,255,255,.2)}.stars .on{color:var(--gold)}
.hero{display:block;width:100%;text-align:left;border:2px solid rgba(168,85,247,.55);background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(168,85,247,.25));color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
.hero:hover{filter:brightness(1.12)}
.hero h3{margin:4px 0 2px;font-size:19px}.hero p{margin:0;color:var(--mut);font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--vio);color:#fff;letter-spacing:.08em;text-transform:uppercase}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:800;margin-bottom:8px;color:#c7d2fe}
.pbar{height:9px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-bottom:18px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ind),var(--vio));transition:width .4s}
.streak{color:#fdba74}
.qtext{font-size:20px;line-height:1.55;font-weight:600;margin:0 0 18px}
.qimg{max-width:100%;max-height:360px;border-radius:14px;display:block;margin:0 auto 14px;background:rgba(0,0,0,.25)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);font-size:16px;line-height:1.4;transition:.15s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.14);transform:translateX(3px)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:800}
.opt.sel{border-color:#818cf8;background:rgba(99,102,241,.28)}
.opt.good{border-color:var(--ok)!important;background:rgba(16,185,129,.25)!important}
.opt.good .k{background:var(--ok);color:#052e1d}
.opt.bad{border-color:var(--bad)!important;background:rgba(244,63,94,.25)!important}
.opt.bad .k{background:var(--bad);color:#4c0519}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:14px;padding:14px;border-radius:16px;border:1px solid;animation:fade .3s}
.fb.ok{background:rgba(16,185,129,.14);border-color:rgba(52,211,153,.5)}
.fb.no{background:rgba(244,63,94,.14);border-color:rgba(251,113,133,.5)}
.fb h4{margin:0 0 6px;font-size:16px}
.ai{margin-top:10px;padding:12px;border-radius:12px;background:rgba(99,102,241,.2);border:1px solid rgba(165,180,252,.45);font-size:14.5px;line-height:1.6}
.ai small{display:block;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#c7d2fe;margin-bottom:4px;font-size:11px}
.xpfloat{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:34px;font-weight:800;color:var(--gold);text-shadow:0 4px 18px rgba(0,0,0,.6);z-index:50;pointer-events:none;animation:up 1.1s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-90px);opacity:0}}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--ind),var(--vio));box-shadow:0 8px 20px rgba(99,102,241,.35)}
.btn:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.btn.sec{background:rgba(255,255,255,.12);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn.red{background:linear-gradient(135deg,#ef4444,#f97316)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.right{margin-left:auto}
.result{text-align:center;padding:10px 0}
.big{font-size:68px;font-weight:800;line-height:1;background:linear-gradient(90deg,#fde68a,#fb7185);-webkit-background-clip:text;background-clip:text;color:transparent}
/* pills */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.pill{border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);padding:8px 13px;border-radius:99px;font-size:13px;font-weight:700}
.pill.on{background:var(--vio);border-color:var(--vio)}
/* wrong list */
.wq{padding:16px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--line);margin-bottom:12px}
.wq .qt{font-weight:600;font-size:16.5px;line-height:1.5;margin-bottom:10px}
.wq .o{padding:7px 10px;border-radius:10px;margin:4px 0;font-size:14.5px;background:rgba(255,255,255,.06)}
.wq .o.good{background:rgba(16,185,129,.25);border:1px solid var(--ok)}
.wq .o.bad{background:rgba(244,63,94,.25);border:1px solid var(--bad)}
.badge{font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px;margin-left:6px}
.badge.fix{background:rgba(52,211,153,.25);color:#a7f3d0}.badge.todo{background:rgba(251,113,133,.25);color:#fecdd3}
textarea.note{width:100%;min-height:70px;margin-top:10px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.28);color:#fff;font:inherit;font-size:14.5px;resize:vertical}
textarea.note:focus{outline:none;border-color:#a5b4fc}
.saved{font-size:11.5px;color:#a7f3d0;margin-left:8px;opacity:0;transition:.3s}
.saved.on{opacity:1}
/* radar */
.rwrap{display:grid;grid-template-columns:minmax(260px,430px) 1fr;gap:20px;align-items:center}
@media(max-width:700px){.rwrap{grid-template-columns:1fr}}
svg.radar{width:100%;height:auto;max-width:400px;display:block;margin:0 auto}
.radar text{fill:#e2e8f0;font:700 15px 'Outfit',sans-serif}
.radar .sm{font-weight:600;fill:#fcd34d;font-size:13px}
.legend{font-size:14px;line-height:1.7}
.legend table{border-collapse:collapse;width:100%}
.legend td{padding:5px 6px;border-bottom:1px solid var(--line)}
.legend .pc{font-weight:800;text-align:right}
.lock{padding:20px;text-align:center;border:2px dashed var(--line);border-radius:18px;color:var(--mut)}
.good-t{color:var(--ok);font-weight:800}.bad-t{color:var(--bad);font-weight:800}
.log{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);margin-bottom:8px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(2,6,23,.75);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .card{max-width:470px;width:100%;padding:24px;background:#1e1b4b}
.modal label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.modal select,.modal input{width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font:inherit}
.toast{position:fixed;right:16px;top:16px;z-index:120;background:#064e3b;border:1px solid var(--ok);padding:10px 16px;border-radius:12px;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="card hdr">
    <a class="homebtn" href="index.html" title="Back to the main page">🏠 Main page</a>
    <div class="logo">⚡ ICT <span>MC Trainer</span></div>
    <div class="xpbox" title="This is your portal XP. Every new correct answer adds +3 XP and lights up the world map.">
      <span class="rank" id="rank">Recruit</span>
      <span>Lv <span id="lv">1</span></span>
      <span class="xpbar"><i id="xpb"></i></span>
      <span id="xp">0 XP</span>
    </div>
    <button class="gear" id="gear" title="AI tutor settings" aria-label="AI tutor settings">⚙️</button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="train">🎯 Train</button>
    <button class="tab" data-tab="wrong">❌ Wrong questions<b id="wcount" hidden>0</b></button>
    <button class="tab" data-tab="radar">📊 Strengths</button>
    <button class="tab" data-tab="logs">📜 Logs</button>
  </nav>

  <main class="card pane" id="app"><div class="empty">Loading questions…</div></main>
</div>

<div class="modal" id="ai-modal"><div class="card">
  <h3 style="margin:0 0 6px">🤖 AI tutor</h3>
  <p class="sub" style="margin:0 0 4px">When you get a question wrong, the AI explains why. Paste a free API key from Google AI Studio (Gemini), OpenAI or Groq. The key stays in this browser only.</p>
  <label for="prov">Provider</label>
  <select id="prov"><option value="gemini">Google Gemini (free key)</option><option value="openai">OpenAI (ChatGPT)</option><option value="groq">Groq (Llama)</option></select>
  <label for="key">API key</label>
  <input type="password" id="key" placeholder="Paste your key…" autocomplete="off">
  <div class="row" style="margin-top:16px"><button class="btn sec right" id="ai-cancel">Cancel</button><button class="btn" id="ai-save">Save</button></div>
</div></div>

<script>
/* ============================ constants & helpers ============================ */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1tqzEoKMua89rtTvodpgZb7GRhcE55dhg/edit?usp=sharing";
const XP_MC = 3;                       /* same as the main page: +3 XP for each NEW correct question */
const TYPES = ['Recall', 'Calculation', 'Code & Logic', 'Compare & Judge', 'Scenario', 'Social & Ethics'];
const AXES = [['A', 'Book A', ['a1', 'a2']], ['B', 'Book B', ['b']], ['C', 'Book C', ['c1', 'c2']], ['D', 'Book D', ['d']], ['E', 'Book E', ['e']], ['EA', 'Elective A', ['ea']], ['EC', 'Elective C', ['ec']]];
const MIN_AX = 3;                      /* answers needed before an axis is drawn */
const UNLOCK_TYPE = 30;                /* answers needed to unlock the question-type radar */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let all = [], topics = [], byHash = {}, quiz = [], qi = 0, score = 0, sel = null, revealed = false, answers = [], title = '', mode = 'topic';
let lastPool = [], lastLabel = '', lastMode = 'topic', streak = 0, sessionXp = 0, sessionNew = new Set(), tab = 'train', pickedTopics = new Set(), wrongNew = 0;

let sfxSynth = null;
function sfx(t) { try { if (typeof Tone === 'undefined') return; sfxSynth = sfxSynth || new Tone.PolySynth(Tone.Synth).toDestination(); sfxSynth.triggerAttackRelease(t === 'ok' ? ['C5', 'E5', 'G5'] : t === 'bad' ? ['G2', 'B2'] : 'C4', t === 'click' ? '32n' : '8n'); } catch (e) {} }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ===================== link with the main page (XP + progress) ===================== */
const activeKey = () => { try { return localStorage.getItem('ictActiveKey') || 'ictFun'; } catch (e) { return 'ictFun'; } };
const portal = () => lsGet(activeKey(), { xp: 0, books: {} });
const QK = () => 'ictQLog:' + activeKey();             /* per-question log, merged and cloud-saved by the main page */
const loadQ = () => lsGet(QK(), {});
function updQ(h, fn) { const q = loadQ(); q[h] = q[h] || {}; fn(q[h]); lsSet(QK(), q); return q[h]; }
function pendingXp() {                                  /* correct answers that the main page has not counted yet */
  const st = portal(), seen = new Set(); let n = 0;
  lsGet('ictMcPending', []).forEach(r => {
    const k = r[2] + ':' + r[1], done = st.books && st.books[r[0]] && st.books[r[0]].mc && st.books[r[0]].mc[k];
    if (!done && !seen.has(r[0] + k)) { seen.add(r[0] + k); n++; }
  });
  return n * XP_MC;
}
function drawXp() {
  const xp = (portal().xp || 0) + pendingXp(), lv = Math.floor(xp / 50) + 1, into = xp % 50;
  $('#xp').textContent = xp + ' XP'; $('#lv').textContent = lv; $('#xpb').style.width = (into / 50 * 100) + '%';
  $('#rank').textContent = ['Recruit', 'Scholar', 'Specialist', 'Master', 'Grandmaster'][Math.min(Math.floor(lv / 4), 4)];
}
addEventListener('storage', drawXp);

/* topic -> {b: book id, c: chapter number} (read by the main page's world map) */
const ICT_BOOK = { A1: 'a1', A2: 'a2', B: 'b', C1: 'c1', C2: 'c2', D1: 'd', D2: 'd', D: 'd', E: 'e', EA: 'ea', EB: 'eb', EC: 'ec' };
function ictTopic(topic) {
  const t = String(topic || '').trim(); let m = /^(EA|EB|EC|A1|A2|B|C1|C2|D1|D2|E)\s*Ch\.?\s*(\d+)/i.exec(t);
  if (m) { const k = m[1].toUpperCase(); let n = +m[2]; if (k === 'D2') n = ({ 4: 2, 5: 3, 6: 6 })[n] || n; return { b: ICT_BOOK[k], c: n }; }
  if (/^D\s+Programming/i.test(t)) return { b: 'd', c: 2 };
  return null;
}
function ictHash(s) { let h = 5381; s = String(s); for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function ictPool(list) { try { const p = {}; list.forEach(q => { const t = ictTopic(q.topic); if (t) { const k = t.b + '-' + t.c; p[k] = (p[k] || 0) + 1; } }); localStorage.setItem('ictMcPool', JSON.stringify(p)); } catch (e) {} }
function ictAttempt(q, ok) { try { const t = ictTopic(q.topic); if (!t) return; const a = JSON.parse(localStorage.getItem('ictMcStat') || '[]'); a.push([t.b, t.c, ok ? 1 : 0]); localStorage.setItem('ictMcStat', JSON.stringify(a)); } catch (e) {} }
function ictCorrect(q) { try { const t = ictTopic(q.topic); if (!t) return; const a = JSON.parse(localStorage.getItem('ictMcPending') || '[]'); a.push([t.b, ictHash(q.question), t.c]); localStorage.setItem('ictMcPending', JSON.stringify(a)); } catch (e) {} }
function isNewCorrect(q) {                              /* would this correct answer earn XP? */
  const t = ictTopic(q.topic); if (!t) return false; const h = ictHash(q.question), k = t.c + ':' + h, st = portal();
  if (st.books && st.books[t.b] && st.books[t.b].mc && st.books[t.b].mc[k]) return false;
  if (lsGet('ictMcPending', []).some(r => r[0] === t.b && r[1] === h)) return false;
  return !sessionNew.has(t.b + k);
}
const axisOf = topic => { const t = ictTopic(topic); if (!t) return null; const a = AXES.filter(x => x[2].indexOf(t.b) > -1)[0]; return a ? a[0] : null; };

/* ============================ question types (auto-tagged) ============================ */
function qType(q) {
  if (q.type) { const m = TYPES.filter(t => t.toLowerCase().indexOf(q.type.toLowerCase()) === 0)[0]; if (m) return m; }
  const stem = q.question.toLowerCase(), all_ = (q.question + ' ' + Object.values(q.options).join(' ')).toLowerCase();
  if (/\b(algorithm|pseudocode|flowchart|loop|array|sql|trace|iteration|procedure|syntax|python|variable|database table|primary key|query)\b|select\s.+\sfrom|:=|←|\bif\b.*\bthen\b/.test(all_)) return 'Code & Logic';
  if (/(calculate|how many|how much|what is the (result|value|total|size|number|maximum|minimum)|\d\s*(bits?|bytes?|kb|mb|gb|tb|mbps|hz|%|px|dpi)\b|binary|hexadecimal|\b[01]{4,}\b)|\d\s*[+\-×x*/÷]\s*\d/.test(all_)) return 'Calculation';
  if (/(privacy|copyright|ordinance|\blaw\b|legal|ethic|piracy|personal data|plagiar|cyberbully|digital divide|social|health|addiction|e-?waste|environment|intellectual property|licen[cs]e|netiquette)/.test(all_)) return 'Social & Ethics';
  if (/(best|most suitable|most appropriate|advantage|disadvantage|benefit|drawback|difference|compare|\bnot\b|except|least|better|primary reason|main purpose)/.test(stem)) return 'Compare & Judge';
  if (stem.length > 140 || /(company|school|shop|mary|john|peter|student|teacher|manager|club|hospital|bank|a user|customer|staff|wants to|plans to)/.test(stem)) return 'Scenario';
  return 'Recall';
}

/* ============================ load questions ============================ */
function parseCSV(t) {
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); f = ''; rows.push(r); r = []; }
    else f += c;
  }
  if (f !== '' || r.length) { r.push(f); rows.push(r); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase().replace(/\s/g, ''));
  return rows.filter(x => x.some(v => String(v).trim())).map(x => { const o = {}; head.forEach((h, i) => o[h] = x[i] == null ? '' : x[i]); return o; });
}
function validate(rows) {
  return rows.map(c => {
    let img = String(c.image || c.picture || c.media || c.img || '').trim();
    if (img.includes('drive.google.com')) { const m = img.match(/\/d\/([a-zA-Z0-9-_]+)/) || img.match(/id=([a-zA-Z0-9-_]+)/); if (m) img = 'https://lh3.googleusercontent.com/d/' + m[1]; }

}

/* ============================ quiz ============================ */
function start(pool, label, md) {
  sfx('click'); title = label; mode = md || 'topic'; lastPool = pool; lastLabel = label; lastMode = mode;
  quiz = pool.slice().sort(() => Math.random() - .5).slice(0, 10); if (!quiz.length) { toast('No questions to practise yet'); return; }

}
function render() {
  sel = null; revealed = false; const q = quiz[qi];

    <div class="pbar"><i style="width:${qi / quiz.length * 100}%"></i></div>
    <div id="qc">${q.image ? `<img class="qimg" src="${esc(q.image)}" alt="" onerror="this.outerHTML='<p class=sub>(image could not load)</p>'">` : ''}<p class="qtext">${q.question}</p></div>
    <div class="opts">${['A', 'B', 'C', 'D'].filter(k => q.options[k]).map(k => `<button class="opt" id="o${k}" data-act="opt" data-k="${k}"><span class="k">${k}</span><span>${q.options[k]}</span></button>`).join('')}</div>

}
function reveal() {
  revealed = true; const q = quiz[qi], ok = sel === q.answer, first = isNewCorrect(q);
  ictAttempt(q, ok);
  updQ(q.h, r => { r.t = q.topic; r.y = q.ty; r.a = (r.a || 0) + 1; r.r = Date.now(); if (ok) { r.c = (r.c || 0) + 1; if (r.w) r.f = (r.f || 0) + 1; } else { if (!r.w) wrongNew++; r.w = (r.w || 0) + 1; r.f = 0; r.l = Date.now(); r.s = sel; } });
  if (ok) {
    score++; streak++; sfx('ok'); if (first) { const t = ictTopic(q.topic); sessionNew.add(t.b + t.c + ':' + q.h); sessionXp += XP_MC; }
    ictCorrect(q); if (first) { const f = document.createElement('div'); f.className = 'xpfloat'; f.textContent = '+' + XP_MC + ' XP'; document.body.appendChild(f); setTimeout(() => f.remove(), 1200); }
  } else { streak = 0; sfx('bad'); $('#qc').classList.add('shake'); }

    ${ok ? `<button class="btn sec sm" data-act="why">💡 Why?</button>` : '<div class="sub" style="margin:0">Saved to <b>Wrong questions</b> so you can redo it later.</div>'}<div id="why"></div></div>`;

}
function next() { qi++; qi < quiz.length ? render() : finish(); }
function finish() {
  const pct = Math.round(score / quiz.length * 100), stars = pct >= 100 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  if (mode === 'topic') { const m = mastery(), k = title === 'Combined challenge' ? 'Combined' : title; if ((m[k] || 0) < stars) m[k] = stars; lsSet('lab_mastery', m); }
  const h = lsGet('lab_history', []); h.unshift({ topic: title, score, total: quiz.length, date: new Date().toISOString() }); lsSet('lab_history', h.slice(0, 30));
  if (pct >= 70 && window.confetti) confetti({ particleCount: 120, spread: 80, origin: { y: .6 } });
  badge(); drawXp();
  $('#app').innerHTML = `<div class="result"><div class="big">${pct}%</div><p class="sub">${score} of ${quiz.length} correct</p>

}

/* ============================ AI explanation ============================ */
function aiCfg() { const c = window.ICT_AI || {}; return { key: localStorage.getItem('lab_ai_key') || c.key || '', prov: localStorage.getItem('lab_ai_provider') || c.provider || 'gemini' }; }
const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
async function askAI(q, picked) {
  const ck = 'ictAi:' + q.h + ':' + (picked || '-'), cached = localStorage.getItem(ck); if (cached) return cached;
  const { key, prov } = aiCfg(); if (!key) throw new Error('nokey');
  const prompt = `You are a friendly HKDSE ICT tutor. A student answered this multiple-choice question.\nQuestion: ${q.question}\nA: ${q.options.A}\nB: ${q.options.B}\nC: ${q.options.C}\nD: ${q.options.D}\nCorrect answer: ${q.answer}\n${picked ? 'Student chose: ' + picked + '\n' : ''}In under 70 words: ${picked && picked !== q.answer ? 'say why their choice is wrong, ' : ''}why ${q.answer} is right, and one short memory tip. Plain text, no headings.`;
  let text = '';
  if (prov === 'gemini') {
    let err; for (const m of ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-2.0-flash']) {
      try { const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
        const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || r.status); text = j.candidates[0].content.parts[0].text; err = null; break; } catch (e) { err = e; }
    } if (err) throw err;
  } else {
    const r = await fetch(prov === 'openai' ? 'https://api.openai.com/v1/chat/completions' : 'https://api.groq.com/openai/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify({ model: prov === 'openai' ? 'gpt-4o-mini' : 'llama-3.1-8b-instant', messages: [{ role: 'user', content: prompt }], max_tokens: 160 }) });
    const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || r.status); text = j.choices[0].message.content;
  }
  try { localStorage.setItem(ck, text); } catch (e) {} return text;
}
async function explain(q, picked, el, auto) {
  const sheet = q.explanation ? `<div class="ai"><small>📘 Explanation</small>${md(q.explanation)}</div>` : '';
  const { key } = aiCfg();
  if (!key) { el.innerHTML = sheet + `<div class="ai"><small>✅ Correct answer</small><b>${q.answer}.</b> ${q.options[q.answer]}</div><p class="sub" style="margin:8px 0 0">Want an AI explanation for every mistake? <a href="#" data-act="aiset" style="color:#c7d2fe">Set up the AI tutor</a></p>`; return; }
  el.innerHTML = sheet + `<div class="ai"><small>🤖 AI tutor</small>Thinking…</div>`;
  try { el.innerHTML = sheet + `<div class="ai"><small>🤖 AI tutor</small>${md(await askAI(q, picked))}</div>`; }
  catch (e) { el.innerHTML = sheet + `<div class="ai"><small>✅ Correct answer</small><b>${q.answer}.</b> ${q.options[q.answer]}<br><span style="color:#fecdd3">AI is unavailable (${esc(e.message || 'error')}). <a href="#" data-act="aiset" style="color:#c7d2fe">Check your key</a></span></div>`; }
}

/* ============================ radar charts ============================ */
function radarSVG(labels, vals, ns) {                    /* vals: 0..100 or null (not enough data) */
  const n = labels.length, cx = 240, cy = 170, R = 108, pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  let s = `<svg class="radar" viewBox="0 0 480 340" role="img" aria-label="Radar chart">`;
  [25, 50, 75, 100].forEach(p => { s += `<polygon points="${labels.map((_, i) => pt(i, R * p / 100).join(',')).join(' ')}" fill="${p === 100 ? 'rgba(255,255,255,.05)' : 'none'}" stroke="rgba(255,255,255,.25)"/>`; });
  labels.forEach((l, i) => { const [x, y] = pt(i, R), [lx, ly] = pt(i, R + 26), an = Math.abs(lx - cx) < 8 ? 'middle' : lx > cx ? 'start' : 'end';
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.25)"/><text x="${lx}" y="${ly - 2}" text-anchor="${an}">${esc(l)}</text><text class="sm" x="${lx}" y="${ly + 12}" text-anchor="${an}">${vals[i] == null ? 'no data' : vals[i] + '%'}</text>`; });
  s += `<polygon points="${vals.map((v, i) => pt(i, R * (v || 0) / 100).join(',')).join(' ')}" fill="rgba(168,85,247,.38)" stroke="#c084fc" stroke-width="2.5"/>`;
  vals.forEach((v, i) => { const [x, y] = pt(i, R * (v || 0) / 100); s += v == null ? `<circle cx="${x}" cy="${y}" r="4" fill="none" stroke="#94a3b8"/>` : `<circle cx="${x}" cy="${y}" r="5" fill="${v >= 70 ? '#34d399' : v >= 50 ? '#fbbf24' : '#fb7185'}" stroke="#fff"/>`; });
  return s + '</svg>';
}
function agg(keyFn, keys) {
  const Q = loadQ(), m = {}; keys.forEach(k => m[k] = { a: 0, c: 0 });
  Object.keys(Q).forEach(h => { const r = Q[h], q = byHash[h], k = q ? keyFn(q) : keyFn({ ax: axisOf(r.t), ty: r.y }); if (k && m[k]) { m[k].a += r.a || 0; m[k].c += r.c || 0; } });
  return keys.map(k => ({ k, a: m[k].a, pct: m[k].a >= MIN_AX ? Math.min(100, Math.round(m[k].c * 100 / m[k].a)) : null, c: m[k].c }));
}
function insight(rows, noun) {
  const ok = rows.filter(r => r.pct != null).sort((a, b) => b.pct - a.pct); if (ok.length < 2) return '<p class="sub">Answer a few more questions in each area to see your strongest and weakest points.</p>';
  return `<p>💪 Strongest ${noun}: <span class="good-t">${esc(ok[0].lab || ok[0].k)} (${ok[0].pct}%)</span><br>🎯 Needs work: <span class="bad-t">${esc(ok[ok.length - 1].lab || ok[ok.length - 1].k)} (${ok[ok.length - 1].pct}%)</span></p>`;
}
function table(rows) { return `<table>${rows.map(r => `<tr><td>${esc(r.lab || r.k)}</td><td style="color:var(--mut)">${r.a} answers</td><td class="pc" style="color:${r.pct == null ? '#94a3b8' : r.pct >= 70 ? '#34d399' : r.pct >= 50 ? '#fbbf24' : '#fb7185'}">${r.pct == null ? '—' : r.pct + '%'}</td></tr>`).join('')}</table>`; }
function renderRadar() {
  const A = agg(q => q.ax, AXES.map(a => a[0])).map((r, i) => (r.lab = AXES[i][1], r)), total = A.reduce((s, r) => s + r.a, 0);
  const weakA = A.filter(r => r.pct != null).sort((a, b) => a.pct - b.pct)[0];
  let h = `<h2>📊 My strengths</h2><p class="sub">Accuracy of every answer you have given in the trainer. An area appears after ${MIN_AX} answers.</p>
    <div class="rwrap"><div>${radarSVG(A.map(r => r.lab), A.map(r => r.pct))}</div><div class="legend"><h3 style="margin:0 0 6px">By book</h3>${table(A)}${insight(A, 'book')}${weakA ? `<button class="btn sm" data-act="train-ax" data-v="${AXES.filter(a => a[1] === weakA.lab)[0][0]}">🎯 Train my weakest book</button>` : ''}</div></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0">`;
  if (total >= UNLOCK_TYPE) {
    const T = agg(q => q.ty, TYPES), weakT = T.filter(r => r.pct != null).sort((a, b) => a.pct - b.pct)[0];
    h += `<div class="rwrap"><div>${radarSVG(TYPES, T.map(r => r.pct))}</div><div class="legend"><h3 style="margin:0 0 6px">🔓 By question type</h3>${table(T)}${insight(T, 'type')}${weakT ? `<button class="btn sm" data-act="train-ty" data-v="${esc(weakT.k)}">🎯 Train my weakest type</button>` : ''}<p class="sub" style="margin-top:10px;font-size:12px">Question types are tagged automatically from the wording of each question.</p></div></div>`;
  } else h += `<div class="lock"><div style="font-size:34px">🔒</div><b>Question-type radar</b><p style="margin:6px 0 10px">Answer <b>${UNLOCK_TYPE}</b> questions to unlock a second radar that shows which <i>types</i> of question you are good or weak at (recall, calculation, code &amp; logic, scenario…).</p><div class="pbar" style="max-width:320px;margin:auto"><i style="width:${Math.min(100, total / UNLOCK_TYPE * 100)}%"></i></div><small>${total} / ${UNLOCK_TYPE} answers</small></div>`;
  $('#app').innerHTML = h;
}
function renderLogs() {
  const h = lsGet('lab_history', []);
  $('#app').innerHTML = `<h2>📜 Mission logs</h2>` + (h.length ? h.map(x => `<div class="log"><div><b>${esc(x.topic)}</b><br><small style="color:var(--mut)">${new Date(x.date).toLocaleString()}</small></div><b style="font-size:20px;color:#a5b4fc">${x.score}/${x.total}</b></div>`).join('') : '<div class="empty">No logs yet.</div>');
}

  noteT = setTimeout(() => { updQ(h, r => { r.n = box.value.slice(0, 300); r.nt = Date.now(); }); const s = box.parentNode.querySelector('.saved'); if (s) { s.classList.add('on'); setTimeout(() => s.classList.remove('on'), 1200); } }, 500);

document.addEventListener('click', e => {

  if (a === 'reload') location.reload();

  else if (a === 'multi') { pickedTopics = new Set(); multiPicker('train'); }
  else if (a === 'pick') { const t = multiPicker.list[+b.dataset.i]; pickedTopics.has(t) ? pickedTopics.delete(t) : pickedTopics.add(t); b.classList.toggle('on'); sfx('click'); }
  else if (a === 'pickall') { pickedTopics = new Set(b.dataset.v === '1' ? multiPicker.list : []); multiPicker(b.dataset.k); }
  else if (a === 'back-train') show('train'); else if (a === 'back-wrong') show('wrong');
  else if (a === 'go-train') { if (!pickedTopics.size) return toast('Choose at least one topic'); start(all.filter(q => pickedTopics.has(q.topic)), 'Combined challenge'); }
  else if (a === 'go-wrong') { if (!pickedTopics.size) return toast('Choose at least one topic'); start(wrongList().filter(w => pickedTopics.has(w.q.topic)).map(w => w.q), 'Redo: wrong questions', 'redo'); }
  else if (a === 'opt') { if (revealed) return; sel = b.dataset.k; sfx('click'); [...document.querySelectorAll('.opt')].forEach(o => o.classList.toggle('sel', o.dataset.k === sel)); $('#go').disabled = false; }
  else if (a === 'go') revealed ? next() : reveal();
  else if (a === 'quit') show('train');
  else if (a === 'why') explain(quiz[qi], sel, $('#why'));
  else if (a === 'retry') start(lastPool, lastLabel, lastMode);
  else if (a === 'tab-wrong') show('wrong'); else if (a === 'tab-train') show('train');
  else if (a === 'redo-all') start(wrongList().map(w => w.q), 'Redo: wrong questions', 'redo');
  else if (a === 'redo-pick') { pickedTopics = new Set(); multiPicker('wrong'); }
  else if (a === 'wtopic') renderWrongTopic(renderWrong.ts[+b.dataset.i]);
  else if (a === 'redo-topic') start(wrongList().filter(w => w.q.topic === renderWrongTopic.t).map(w => w.q), 'Redo: ' + renderWrongTopic.t, 'redo');
  else if (a === 'wexplain') { const q = byHash[b.dataset.h], r = loadQ()[b.dataset.h] || {}; explain(q, r.s, b.closest('.wq').querySelector('.why')); }
  else if (a === 'wdel') { updQ(b.dataset.h, r => { r.w = 0; r.f = 0; }); renderWrongTopic(renderWrongTopic.t); badge(); }
  else if (a === 'train-ax') start(all.filter(q => q.ax === b.dataset.v), (AXES.filter(x => x[0] === b.dataset.v)[0] || [])[1] || 'Weakest book');
  else if (a === 'train-ty') start(all.filter(q => q.ty === b.dataset.v), b.dataset.v + ' questions');
  else if (a === 'aiset') $('#gear').click();
});
$('#gear').onclick = () => { const c = aiCfg(); $('#key').value = localStorage.getItem('lab_ai_key') || ''; $('#prov').value = c.prov; $('#ai-modal').classList.add('on'); };
$('#ai-cancel').onclick = () => $('#ai-modal').classList.remove('on');
$('#ai-save').onclick = () => { localStorage.setItem('lab_ai_key', $('#key').value.trim()); localStorage.setItem('lab_ai_provider', $('#prov').value); $('#ai-modal').classList.remove('on'); toast('AI tutor saved'); };
addEventListener('keydown', e => { if (document.getElementById('go') && !document.querySelector('.modal.on')) { const k = e.key.toUpperCase(); if (!revealed && 'ABCD'.indexOf(k) > -1 && k.length === 1 && document.getElementById('o' + k)) document.getElementById('o' + k).click(); else if (e.key === 'Enter') document.getElementById('go').click(); } });
addEventListener('DOMContentLoaded', init);
</script>
